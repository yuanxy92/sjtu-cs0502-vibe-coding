<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>聚类课堂小测</title>
<style>
:root{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:22px;
  line-height:1.45;
  color:#102344;
  background:#f6f8fc;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --red:#b91c1c;
  --amber:#b45309;
  --green:#15803d;
  --line:#d6deea;
  --muted:#53647c;
  --card:#fff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(900px 420px at 8% -60px, rgba(37,99,235,.09), transparent 60%),
  radial-gradient(760px 380px at 96% -40px, rgba(180,83,9,.08), transparent 60%),
  radial-gradient(1000px 520px at 50% 108%, rgba(21,128,61,.07), transparent 62%),
  #f6f8fc;
  background-attachment:fixed}
button,select,input{font:inherit;color:inherit}
button{min-height:44px;padding:8px 18px;border:1px solid #bac8da;border-radius:7px;background:#fff;font-weight:650;transition:background-color .15s,transform .15s;cursor:pointer}
button:hover:not(:disabled){background:#eff5ff;border-color:#6c96e8}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{cursor:not-allowed;background:#f0f3f7;color:#8c99ab;border-color:#e1e7f0}
button:focus-visible{outline:3px solid #8eaff4;outline-offset:3px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.primary:hover:not(:disabled){background:var(--blue-dark)}
h1,h2,h3,p{margin:0}
h1{font-size:43px;line-height:1.15;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:28px;line-height:1.25}
h3{font-size:23px}
a{color:var(--blue-dark)}
html{scrollbar-width:thin;scrollbar-color:#b9c8de #eef2f8}
.app{max-width:1460px;margin:auto;padding:30px 34px 40px}
.app-header{position:relative;overflow:hidden;display:grid;gap:8px;padding:22px 26px;border:1px solid #c7d7ef;border-radius:14px;
  background:linear-gradient(115deg,#eaf1ff 0%,#f7f9fd 42%,#fdf4e7 76%,#eaf7ef 100%)}
.header-motif{position:absolute;right:20px;top:14px;width:220px;height:132px;opacity:.55;pointer-events:none}
.eyebrow{color:var(--blue);font-size:19px;font-weight:750;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:23px;max-width:64ch}
.muted{color:var(--muted)}

.note{border-left:4px solid #e6be66;background:#fff9eb;padding:14px 18px;font-size:20px;line-height:1.6;color:#854d0e;border-radius:0 6px 6px 0;margin-top:16px}
.note strong{display:block;font-size:21px;margin-bottom:6px}
.note p+p{margin-top:6px}
.note.blue{border-color:#93b4e6;background:#f0f6ff;color:#17427a}
.note.green{border-color:#86c9a9;background:#f0fbf5;color:#116149}
.howto{margin-top:22px}

.panel{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:22px 24px;min-width:0}
.qpanel{margin-top:26px}
.qhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.qtag{font-size:19px;font-weight:750;color:var(--muted);border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.qprompt{font-size:22px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.given{margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #c3d3ea;background:#f2f6fc;border-radius:16px;padding:2px 11px;font-size:19px;line-height:1.5}
.chip b{font-weight:750}

.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:20px}
.grid2.qgrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.km-wrap{overflow-x:auto;margin-top:6px}
.km-wrap svg{display:block;width:100%;min-width:640px;height:auto;max-height:560px}
.km-hint{font-size:19px;color:var(--muted);margin-top:8px}
.tasks p{font-size:20px}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
table.trace{border-collapse:collapse;width:100%;font-size:20px}
table.trace th,table.trace td{border-bottom:1px solid #e6ebf3;padding:9px 14px;text-align:left;white-space:nowrap}
table.trace th{background:#f4f7fc;color:var(--muted);font-size:18px;font-weight:700}
table.trace td{font-family:var(--mono)}
table.trace tr:last-child td{border-bottom:0}
table.trace.d2 td{font-size:19px}
tr.is-flip td{background:#fff9eb}
table.trace.d2 td.is-hit{background:#dbeafe}
.badge{display:inline-block;border-radius:5px;padding:1px 8px;font-family:var(--mono);font-size:19px;font-weight:750;white-space:nowrap}
.badge.c1{background:#d8f3e3;color:#116149}
.badge.c2{background:#fff0cd;color:#854d0e}
.badge.flip{background:#ffe0e2;color:#991b1b;font-size:18px}
.assign-sum{font-size:20px;margin-top:10px;font-weight:650}

.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:34px}
.sec-head h2{font-size:30px}
.sec-head span{font-size:20px;color:var(--muted)}
table.trace.matrix th,table.trace.matrix td{padding:7px 11px;font-size:19px;text-align:center}
table.trace.matrix td.is-hit{background:#dbeafe}
table.trace.matrix td.diag{color:#8c99ab}
table.trace td.soft{white-space:normal;overflow-wrap:anywhere;min-width:200px;max-width:430px;font-size:19px}
.badge.core{background:#d8f3e3;color:#116149}
.badge.border{background:#fff0cd;color:#854d0e}
.badge.noise{background:#e5e7eb;color:#1f2937}
.reason{display:block;font-family:inherit;font-size:18px;font-weight:500;color:var(--muted);white-space:normal;min-width:230px;margin-top:4px}
.formula-card.noisecard{border-color:#9ca3af;background:#f3f4f6}

.formula-card{display:grid;gap:7px;border:1px solid #c7d7ef;border-radius:9px;background:#f0f6ff;padding:16px 20px;margin-top:14px}
.formula{font-family:var(--mono);font-size:26px;font-weight:700;color:#17427a;overflow-wrap:anywhere}
.formula-sub{font-size:20px;color:var(--muted)}
.formula-card.c1card{border-color:#86c9a9;background:#f0fbf5}
.formula-card.c2card{border-color:#e6be66;background:#fff9eb}

.reveal-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.reveal-bar button{font-size:20px;padding:8px 16px}
.step-count{color:var(--muted);font-size:20px;margin-left:auto}
.step-nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.step-title{font-size:21px;font-weight:750;color:var(--blue-dark)}
.step-dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.step-dot{min-height:0;height:36px;width:auto;min-width:36px;padding:0 11px;border-radius:18px;font-size:18px;font-weight:750;color:var(--muted);background:#eef2f8;border:1px solid var(--line);cursor:pointer;transition:background-color .15s}
.step-dot:hover{background:#dbeafe;border-color:#a9c6f5}
.step-dot[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.step-dot.done{background:#dbeafe;border-color:#a9c6f5;color:var(--blue-dark)}
.step-view{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;padding:18px 20px;min-height:360px;max-height:600px;overflow-y:auto;min-width:0;scrollbar-width:thin;scrollbar-color:#9db4d6 #eef2f8}
.step-view::-webkit-scrollbar{width:9px}
.step-view::-webkit-scrollbar-track{background:#eef2f8;border-radius:0 10px 10px 0}
.step-view::-webkit-scrollbar-thumb{background:#9db4d6;border-radius:5px}
.step-view::-webkit-scrollbar-thumb:hover{background:#6c96e8}
.step-view .step-block{border:0;background:none;padding:0;min-width:0}
.step-view .step-block h3{margin-bottom:10px}
.step-view.swap-in{animation:stepIn .35s ease-out}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.blank-note{margin-top:0}
.km-pt,.km-star,.km-ghost{transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .45s}
.km-pt circle{transition:fill .45s,stroke .45s}
.dbs-edge{transition:opacity .5s}
.loss-h{margin-top:18px}
.footer{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;font-size:19px;color:var(--muted);display:grid;gap:6px}
@media (max-width:1100px){
  .grid2,.grid2.qgrid{grid-template-columns:minmax(0,1fr)}
  :root{font-size:20px}
  .header-motif{display:none}
  .km-wrap svg{max-height:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <svg class="header-motif" viewBox="0 0 220 132" aria-hidden="true">
      <g fill="#c9ecd8" stroke="#15803d" stroke-width="1.4">
        <circle cx="46" cy="40" r="6"/><circle cx="62" cy="52" r="6"/><circle cx="40" cy="60" r="6"/><circle cx="58" cy="30" r="6"/>
      </g>
      <g fill="#fde4c8" stroke="#b45309" stroke-width="1.4">
        <circle cx="150" cy="36" r="6"/><circle cx="168" cy="48" r="6"/><circle cx="146" cy="56" r="6"/><circle cx="166" cy="26" r="6"/>
      </g>
      <g fill="#d3ecfa" stroke="#22b1e8" stroke-width="1.4">
        <circle cx="96" cy="96" r="6"/><circle cx="116" cy="104" r="6"/><circle cx="104" cy="82" r="6"/><circle cx="126" cy="90" r="6"/>
      </g>
      <g fill="#15803d"><path d="M52 38 l4 8 9 1 -6.5 6 1.5 9 -8 -4.5 -8 4.5 1.5 -9 -6.5 -6 9 -1 z"/></g>
      <g fill="#b45309"><path d="M156 34 l4 8 9 1 -6.5 6 1.5 9 -8 -4.5 -8 4.5 1.5 -9 -6.5 -6 9 -1 z"/></g>
      <g fill="#22b1e8"><path d="M110 86 l4 8 9 1 -6.5 6 1.5 9 -8 -4.5 -8 4.5 1.5 -9 -6.5 -6 9 -1 z"/></g>
      <circle cx="196" cy="98" r="6" fill="#1f2937" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="3 2"/>
    </svg>
    <p class="eyebrow">计算机科学导论 · 数据挖掘</p>
    <h1>聚类课堂小测</h1>
    <p class="subtitle">四道手算题：K-Means 两道＋DBSCAN 两道。整数坐标直接给出、参数给定，先在纸上算，再逐步揭示答案对照。全部数据内嵌，可离线打开。</p>
  </header>

  <div id="quizRoot"></div>

  <footer class="footer">
    <p class="muted">配套演示：<a href="../clustering-lab/">聚类实验室 ↗</a>（K-Means 逐拍分步＋16 种数据上 K-Means／DBSCAN 对照）。星＝中心，圆点＝数据点；绿＝簇 1，橙＝簇 2，黑虚线＝噪声（DBSCAN）。</p>
  </footer>
</main>
<script>
/* 聚类课堂小测：K-Means 两道＋DBSCAN 两道，可手算。
   揭示方式：散点图动画＋单步骤面板原地更新（不堆叠）。坐标全整数、d² 全整数、
   K-Means 每轮无平局且均值全整数；DBSCAN 邻域含自己、d≤Eps 取等号算。 */
(function () {
  'use strict';

  const QUESTIONS = [
    {
      id: 'q1', title: '第 1 题', tag: 'K-Means 基础 · 6 点 · K=2',
      points: [
        { name: 'A', x: 1, y: 1 }, { name: 'B', x: 3, y: 1 }, { name: 'C', x: 2, y: 4 },
        { name: 'D', x: 7, y: 7 }, { name: 'E', x: 9, y: 7 }, { name: 'F', x: 8, y: 10 }
      ],
      init: [[1, 1], [9, 7]],
      prompt: '6 个点的坐标在下表直接给出。K=2，初始中心 c₁=(1,1)、c₂=(9,7)，欧氏距离。手算 K-Means：逐轮写出分配与更新，直到收敛，给出最终的簇、中心与 loss。'
    },
    {
      id: 'q2', title: '第 2 题', tag: 'K-Means 进阶 · 8 点 · K=2',
      points: [
        { name: 'A', x: 1, y: 1 }, { name: 'B', x: 5, y: 1 }, { name: 'C', x: 3, y: 4 },
        { name: 'D', x: 7, y: 8 }, { name: 'E', x: 11, y: 8 }, { name: 'F', x: 7, y: 12 },
        { name: 'G', x: 11, y: 12 }, { name: 'H', x: 9, y: 10 }
      ],
      init: [[1, 1], [4, 6]],
      prompt: '8 个点的坐标在下表直接给出。K=2，初始中心 c₁=(1,1)、c₂=(4,6)，欧氏距离。手算 K-Means：逐轮写出分配与更新，直到收敛，给出最终的簇、中心与 loss。'
    }
  ];

  const DBS_QUESTIONS = [
    {
      id: 'q3', title: '第 3 题', tag: 'DBSCAN 基础 · 8 点 · 核心/边界/噪声',
      points: [
        { name: 'A', x: 1, y: 1 }, { name: 'B', x: 4, y: 1 }, { name: 'C', x: 1, y: 5 },
        { name: 'D', x: 12, y: 1 }, { name: 'E', x: 15, y: 1 }, { name: 'F', x: 12, y: 5 },
        { name: 'G', x: 4, y: 8 }, { name: 'H', x: 9, y: 10 }
      ],
      parts: [{
        eps: 5, minPts: 3, label: 'Eps=5',
        insight: '边界点 G 被核心点 C 收进簇 1，但 G 自己不是核心——它的邻居 H 不会跟着被收进来（边界点不再向外扩），H 仍是噪声。'
      }],
      prompt: '8 个点的坐标在下表直接给出。DBSCAN 参数 Eps=5、MinPts=3（邻域含自己，d≤Eps 算邻居，恰好等于也算）。手算：① 逐对算 d²，标出每个点的邻域；② 数邻域点数，判核心／边界／噪声；③ 从核心点扩簇，给出最终的簇与噪声。'
    },
    {
      id: 'q4', title: '第 4 题', tag: 'DBSCAN 进阶 · 7 点 · 桥接与 Eps 敏感性',
      points: [
        { name: 'A', x: 1, y: 1 }, { name: 'B', x: 4, y: 1 }, { name: 'C', x: 1, y: 6 },
        { name: 'D', x: 10, y: 1 }, { name: 'E', x: 13, y: 1 }, { name: 'F', x: 10, y: 5 },
        { name: 'G', x: 7, y: 1 }
      ],
      parts: [
        {
          eps: 5, minPts: 3, label: '(a) Eps=5',
          insight: 'G 同时在 B 和 D 的邻域里（d² 都是 9），两个三角经桥点 G 密度相连 → 并成一簇。C 的邻域只有 {A,C}=2 点（A–C 的 d²=25 恰好等于 Eps²），是边界点，经核心 A 收编、收编即止。K-Means 在这里会硬切成两半；DBSCAN 只认密度相连。'
        },
        {
          eps: 3, minPts: 3, label: '(b) Eps=3',
          insight: 'Eps 从 5 缩到 3：A、E 从核心降为边界（邻域只剩 2 点），C 从边界、F 从核心直接掉成噪声（半径内没有核心）。同一份数据，参数不同结果不同——DBSCAN 的参数敏感性（聚类实验室里拖 Eps 滑杆可现场复现）。'
        }
      ],
      prompt: '7 个点的坐标在下表直接给出，MinPts=3。分别手算两种参数下的 DBSCAN：(a) Eps=5；(b) Eps=3。各写出邻域、判核心／边界／噪声、扩簇，最后对照：Eps 变小改变了什么？'
    }
  ];

  function d2(p, c) { const dx = p.x - c[0], dy = p.y - c[1]; return dx * dx + dy * dy; }

  function solve(q) {
    const pts = q.points;
    let centers = q.init.map(c => [c[0], c[1]]);
    const rounds = [];
    let prev = null;
    for (let r = 0; r < 12; r++) {
      const table = pts.map(p => centers.map(c => d2(p, c)));
      const assign = table.map(row => (row[0] <= row[1] ? 0 : 1));
      const clusters = [[], []];
      assign.forEach((a, i) => clusters[a].push(i));
      const sums = clusters.map(cl => [cl.reduce((s, i) => s + pts[i].x, 0), cl.reduce((s, i) => s + pts[i].y, 0)]);
      const next = clusters.map((cl, k) => (cl.length ? [sums[k][0] / cl.length, sums[k][1] / cl.length] : [centers[k][0], centers[k][1]]));
      const flips = prev ? assign.map((a, i) => (a !== prev[i] ? i : -1)).filter(i => i >= 0) : [];
      const changed = prev ? flips.length > 0 : true;
      rounds.push({ centers: centers.map(c => [c[0], c[1]]), table, assign, clusters, sums, next, flips, changed });
      if (prev && !changed) break;
      prev = assign;
      centers = next;
    }
    const last = rounds[rounds.length - 1];
    const lossParts = pts.map((p, i) => ({ i, d2: d2(p, last.centers[last.assign[i]]) }));
    const loss = lossParts.reduce((s, t) => s + t.d2, 0);
    return { rounds, loss, lossParts, final: { centers: last.centers, assign: last.assign, clusters: last.clusters } };
  }

  function dbscan(points, eps, minPts) {
    const n = points.length;
    const D = points.map(p => points.map(q => d2(p, [q.x, q.y])));
    const eps2 = eps * eps;
    const neigh = D.map(row => row.map((v, j) => (v <= eps2 ? j : -1)).filter(j => j >= 0));
    const core = neigh.map(ns => ns.length >= minPts);
    const verdicts = [], borderVia = [];
    for (let i = 0; i < n; i++) {
      if (core[i]) { verdicts.push('core'); borderVia.push(-1); }
      else {
        const via = neigh[i].find(j => core[j]);
        if (via !== undefined) { verdicts.push('border'); borderVia.push(via); }
        else { verdicts.push('noise'); borderVia.push(-1); }
      }
    }
    const labels = new Array(n).fill(null);
    const clusters = [];
    for (let i = 0; i < n; i++) {
      if (labels[i] !== null || !core[i]) continue;
      const cid = clusters.length;
      const members = [i];
      labels[i] = cid;
      const expanded = new Set();
      const queued = new Set([i].concat(neigh[i]));
      const queue = neigh[i].slice();
      while (queue.length) {
        const j = queue.shift();
        if (labels[j] === null) { labels[j] = cid; members.push(j); }
        if (core[j] && !expanded.has(j)) { expanded.add(j); neigh[j].forEach(k => { if (!queued.has(k)) { queued.add(k); queue.push(k); } }); }
      }
      clusters.push(members);
    }
    const noise = [];
    for (let i = 0; i < n; i++) if (labels[i] === null) { labels[i] = -1; noise.push(i); }
    return { D, neigh, core, verdicts, borderVia, labels, clusters, noise };
  }

  const core = { QUESTIONS, DBS_QUESTIONS, solve, dbscan, d2 };
  if (typeof module !== 'undefined' && module.exports) module.exports = core;
  if (typeof window === 'undefined') return;
  window.ClusteringQuizCore = core;

  const COLORS = ['#2fbe6e', '#f0a13a'];
  const DARK = ['#15803d', '#b45309'];
  const NOISE = '#1f2937';
  const CORE_BLUE = '#2563eb';
  const ALL = QUESTIONS.concat(DBS_QUESTIONS);
  const SOL = QUESTIONS.map(solve);
  const DBS_SOL = DBS_QUESTIONS.map(q => q.parts.map(p => dbscan(q.points, p.eps, p.minPts)));
  const state = { step: [0, 0, 0, 0] };

  const fmtC = c => '(' + c[0] + ', ' + c[1] + ')';
  const names = (q, cl) => cl.map(i => q.points[i].name).join('、');
  const badge = k => '<span class="badge c' + (k + 1) + '">簇 ' + (k + 1) + '</span>';

  function sub(p, c) {
    const dx = p.x - c[0], dy = p.y - c[1];
    const sq = v => (v < 0 ? '(−' + (-v) + ')²' : v + '²');
    return '(' + p.x + '−' + c[0] + ')²+(' + p.y + '−' + c[1] + ')² = ' + sq(dx) + '+' + sq(dy) + ' = ' + dx * dx + '+' + dy * dy + ' = ' + (dx * dx + dy * dy);
  }

  function starPath(cx, cy, r) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 ? r * 0.45 : r;
      pts.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return 'M' + pts.join('L') + 'Z';
  }

  function plotFrame(xs, ys) {
    const xmin = Math.min.apply(null, xs) - 1, xmax = Math.max.apply(null, xs) + 1;
    const ymin = Math.min.apply(null, ys) - 1, ymax = Math.max.apply(null, ys) + 1;
    const X = v => 56 + (v - xmin) / (xmax - xmin) * 560;
    const Y = v => 474 - (v - ymin) / (ymax - ymin) * 450;
    const tick = xmax - xmin <= 13 ? 1 : 2;
    let g = '';
    for (let t = Math.ceil(xmin); t <= Math.floor(xmax); t += tick) {
      g += '<line x1="' + X(t) + '" y1="24" x2="' + X(t) + '" y2="474" stroke="#e6ebf3" stroke-width="1"/>';
      g += '<text x="' + X(t) + '" y="500" font-size="18" fill="#53647c" text-anchor="middle">' + t + '</text>';
    }
    for (let t = Math.ceil(ymin); t <= Math.floor(ymax); t += tick) {
      g += '<line x1="56" y1="' + Y(t) + '" x2="616" y2="' + Y(t) + '" stroke="#e6ebf3" stroke-width="1"/>';
      g += '<text x="44" y="' + (Y(t) + 6) + '" font-size="18" fill="#53647c" text-anchor="end">' + t + '</text>';
    }
    g += '<line x1="56" y1="474" x2="616" y2="474" stroke="#94a3b8" stroke-width="2"/>';
    g += '<line x1="56" y1="24" x2="56" y2="474" stroke="#94a3b8" stroke-width="2"/>';
    g += '<text x="622" y="480" font-size="20" font-weight="700" fill="#53647c">x</text>';
    g += '<text x="40" y="20" font-size="20" font-weight="700" fill="#53647c">y</text>';
    return { X, Y, g };
  }

  /* ---- 步骤内容（单面板原地替换，不堆叠） ---- */

  function assignStep(q, sol, r, ri) {
    const head = '<h3>第 ' + (ri + 1) + ' 轮 · 分配：每个点归最近中心（c₁=' + fmtC(r.centers[0]) + '，c₂=' + fmtC(r.centers[1]) + '）</h3>';
    const rows = q.points.map((p, i) => {
      const win = r.table[i][0] <= r.table[i][1] ? 0 : 1;
      const flip = r.flips.indexOf(i) >= 0;
      return '<tr' + (flip ? ' class="is-flip"' : '') + '><td>' + p.name + (flip ? ' <span class="badge flip">改归属</span>' : '') + '</td><td>(' + p.x + ', ' + p.y + ')</td><td class="' + (win === 0 ? 'is-hit' : '') + '">' + sub(p, r.centers[0]) + '</td><td class="' + (win === 1 ? 'is-hit' : '') + '">' + sub(p, r.centers[1]) + '</td><td>' + badge(win) + '</td></tr>';
    }).join('');
    let note = '';
    if (ri === 0) note += '<div class="note blue"><strong>为什么只比 d²？</strong><p>开方是单调的：d² 小 ⇔ 距离近。手算时把平方和比出来就够了，不必开方。</p></div>';
    if (r.flips.length) {
      const txt = r.flips.map(i => {
        const p = q.points[i];
        const prevA = sol.rounds[ri - 1].assign[i];
        return p.name + '(' + p.x + ',' + p.y + ')：上一轮归簇 ' + (prevA + 1) + '，这一轮 d² 到 c₁=' + r.table[i][0] + '、到 c₂=' + r.table[i][1] + ' → 改归簇 ' + (r.assign[i] + 1);
      }).join('；');
      note += '<div class="note"><strong>有点改归属！</strong><p>' + txt + '。中心移动后归属可能变化——所以要一轮一轮迭代，不能只算一轮就停。看图：改归属的点正在变色。</p></div>';
    }
    if (ri > 0 && !r.flips.length) note += '<div class="note green"><strong>收敛</strong><p>所有点归属与上一轮完全相同 → 均值算出的中心不变 → 算法停止。中心保持 c₁=' + fmtC(r.centers[0]) + '、c₂=' + fmtC(r.centers[1]) + '。</p></div>';
    const summary = '<p class="assign-sum">本轮划分：簇 1 ' + names(q, r.clusters[0]) + '（' + r.clusters[0].length + ' 点）｜ 簇 2 ' + names(q, r.clusters[1]) + '（' + r.clusters[1].length + ' 点）</p>';
    return '<div class="step-block">' + head + '<div class="table-wrap"><table class="trace d2"><thead><tr><th>点</th><th>坐标</th><th>d² 到 c₁</th><th>d² 到 c₂</th><th>归属（蓝底＝更近）</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + summary + note + '</div>';
  }

  function updateStep(q, r, ri) {
    const cards = r.clusters.map((cl, k) => {
      if (!cl.length) return '';
      const n = cl.length;
      const xs = cl.map(i => q.points[i].x).join('+');
      const ys = cl.map(i => q.points[i].y).join('+');
      const c = k === 0 ? 'c₁' : 'c₂';
      return '<div class="formula-card"><div class="formula-sub">簇 ' + (k + 1) + '（' + names(q, cl) + '，n=' + n + '）：中心＝成员坐标的算术均值</div>' +
        '<div class="formula">' + c + 'x = (' + xs + ')/' + n + ' = ' + r.sums[k][0] + '/' + n + ' = ' + r.next[k][0] + '</div>' +
        '<div class="formula">' + c + 'y = (' + ys + ')/' + n + ' = ' + r.sums[k][1] + '/' + n + ' = ' + r.next[k][1] + '</div>' +
        '<div class="formula-sub">' + c + '：' + fmtC(r.centers[k]) + ' → <b>' + fmtC(r.next[k]) + '</b>（图中星正在移动）</div></div>';
    }).join('');
    return '<div class="step-block"><h3>第 ' + (ri + 1) + ' 轮 · 更新：中心＝成员的算术均值</h3>' + cards + '</div>';
  }

  function finalStep(q, sol) {
    const f = sol.final;
    const cards = f.clusters.map((cl, k) => {
      const members = cl.map(i => q.points[i].name + '(' + q.points[i].x + ',' + q.points[i].y + ')').join('、');
      return '<div class="formula-card c' + (k + 1) + 'card"><div class="formula-sub">簇 ' + (k + 1) + ' · ' + cl.length + ' 点</div><div class="formula">' + members + '</div><div class="formula-sub">中心 ' + (k === 0 ? 'c₁' : 'c₂') + ' = ' + fmtC(f.centers[k]) + '</div></div>';
    }).join('');
    const lossRows = q.points.map((p, i) => '<tr><td>' + p.name + '</td><td>' + badge(f.assign[i]) + '</td><td>' + sub(p, f.centers[f.assign[i]]) + '</td></tr>').join('');
    const per = [0, 1].map(k => sol.lossParts.filter(t => f.assign[t.i] === k).reduce((s, t) => s + t.d2, 0));
    return '<div class="step-block"><h3>最终结果 · 共 ' + sol.rounds.length + ' 轮（第 ' + sol.rounds.length + ' 轮复核：无点改归属）</h3>' + cards +
      '<h3 class="loss-h">loss＝每个点到其所属中心距离的平方和</h3>' +
      '<div class="table-wrap"><table class="trace d2"><thead><tr><th>点</th><th>所属簇</th><th>到所属中心的 d²</th></tr></thead><tbody>' + lossRows + '</tbody></table></div>' +
      '<div class="formula-card"><div class="formula">loss = ' + per[0] + ' + ' + per[1] + ' = ' + sol.loss + '</div><div class="formula-sub">簇 1 贡献 ' + per[0] + '，簇 2 贡献 ' + per[1] + '。</div></div>' +
      '<div class="note green"><strong>对照检查</strong><p>你的纸上结果：簇成员、中心、收敛轮数、loss 四项都对上了吗？图中已按最终簇着色，空心虚线星＝初始中心。</p></div></div>';
  }

  function dbsMatrixStep(q, part, res) {
    const eps2 = part.eps * part.eps;
    const head = '<h3>' + part.label + ' · 第 1 步：逐对算 d²（蓝底＝d²≤Eps²=' + eps2 + '，即邻域）</h3>';
    const header = '<tr><th>点</th>' + q.points.map(p => '<th>' + p.name + '</th>').join('') + '</tr>';
    const rows = q.points.map((p, i) => '<tr><td>' + p.name + '</td>' + res.D[i].map((v, j) => '<td class="' + (v <= eps2 ? 'is-hit' : '') + (i === j ? ' diag' : '') + '">' + v + '</td>').join('') + '</tr>').join('');
    let exTxt = '';
    let ex = null;
    for (let i = 0; i < q.points.length && !ex; i++) {
      for (let j = i + 1; j < q.points.length; j++) {
        if (res.D[i][j] === eps2) { ex = [i, j]; break; }
      }
    }
    if (ex) exTxt = '示例 ' + q.points[ex[0]].name + '–' + q.points[ex[1]].name + '：' + sub(q.points[ex[0]], [q.points[ex[1]].x, q.points[ex[1]].y]) + '，恰好等于 Eps²=' + eps2 + ' → 算邻域（≤ 含等号）。';
    const note = '<div class="note blue"><strong>怎么比</strong><p>d≤Eps ⇔ d²≤Eps²，不必开方。' + exTxt + '对角线上的 0 是自己——邻域含自己。图中浮现的连线就是邻域边。</p></div>';
    return '<div class="step-block">' + head + '<div class="table-wrap"><table class="trace matrix"><thead>' + header + '</thead><tbody>' + rows + '</tbody></table></div>' + note + '</div>';
  }

  function dbsClassifyStep(q, part, res) {
    const head = '<h3>' + part.label + ' · 第 2 步：数邻域（含自己），与 MinPts=' + part.minPts + ' 比，判类型</h3>';
    const rows = q.points.map((p, i) => {
      const ns = res.neigh[i];
      const members = ns.map(j => q.points[j].name + '(' + res.D[i][j] + ')').join('、');
      const v = res.verdicts[i];
      let bdg, reason;
      if (v === 'core') { bdg = '<span class="badge core">核心</span>'; reason = ns.length + '≥' + part.minPts + ' → 核心，可开簇／扩簇'; }
      else if (v === 'border') { bdg = '<span class="badge border">边界</span>'; reason = ns.length + '&lt;' + part.minPts + '，但半径内有核心 ' + q.points[res.borderVia[i]].name + ' → 边界，被收进簇'; }
      else { bdg = '<span class="badge noise">噪声</span>'; reason = ns.length + '&lt;' + part.minPts + '，半径内无核心 → 噪声'; }
      return '<tr><td>' + p.name + '</td><td class="soft">' + members + '</td><td>' + ns.length + '</td><td>' + bdg + '<span class="reason">' + reason + '</span></td></tr>';
    }).join('');
    const note = '<div class="note blue"><strong>三种点（p71 定义）</strong><p>核心点：邻域点数 ≥ MinPts（含自己）。边界点：邻域点数 &lt; MinPts，但半径内至少 1 个核心点——被收进簇，不再外扩。噪声：既非核心也非边界，不属于任何簇。图中：蓝＝核心，琥珀＝边界，黑虚线＝噪声。</p></div>';
    return '<div class="step-block">' + head + '<div class="table-wrap"><table class="trace"><thead><tr><th>点</th><th>邻域成员（d²）</th><th>点数</th><th>判定</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + note + '</div>';
  }

  function dbsExpandStep(q, part, res) {
    const head = '<h3>' + part.label + ' · 第 3 步：从核心点扩簇（密度可达链）</h3>';
    const cards = res.clusters.map((raw, k) => {
      const cl = raw.slice().sort((a, b) => a - b);
      const cores = cl.filter(i => res.core[i]).map(i => q.points[i].name);
      const borders = cl.filter(i => !res.core[i]).map(i => q.points[i].name + '（经 ' + q.points[res.borderVia[i]].name + '）');
      return '<div class="formula-card c' + (k + 1) + 'card"><div class="formula-sub">簇 ' + (k + 1) + ' · ' + cl.length + ' 点</div><div class="formula">' + cl.map(i => q.points[i].name).join('、') + '</div><div class="formula-sub">核心：' + cores.join('、') + (borders.length ? '；边界：' + borders.join('、') + '（收编即止）' : '') + '</div></div>';
    }).join('');
    const noiseTxt = res.noise.length ? '<div class="formula-card noisecard"><div class="formula-sub">噪声 · ' + res.noise.length + ' 点（不属于任何簇）</div><div class="formula">' + res.noise.map(i => q.points[i].name).join('、') + '</div></div>' : '';
    const insight = part.insight ? '<div class="note green"><strong>看点</strong><p>' + part.insight + '</p></div>' : '';
    return '<div class="step-block">' + head + cards + noiseTxt + insight + '</div>';
  }

  function dbsFinalStep(q, parts, results) {
    if (parts.length === 1) {
      const res = results[0];
      const cards = res.clusters.map((raw, k) => {
        const cl = raw.slice().sort((a, b) => a - b);
        const members = cl.map(i => q.points[i].name + '(' + q.points[i].x + ',' + q.points[i].y + ')').join('、');
        return '<div class="formula-card c' + (k + 1) + 'card"><div class="formula-sub">簇 ' + (k + 1) + ' · ' + cl.length + ' 点</div><div class="formula">' + members + '</div></div>';
      }).join('');
      const noiseCard = res.noise.length ? '<div class="formula-card noisecard"><div class="formula-sub">噪声 · ' + res.noise.length + ' 点</div><div class="formula">' + res.noise.map(i => q.points[i].name + '(' + q.points[i].x + ',' + q.points[i].y + ')').join('、') + '</div></div>' : '';
      return '<div class="step-block"><h3>最终结果 · ' + parts[0].label + '，MinPts=' + parts[0].minPts + '</h3>' + cards + noiseCard +
        '<div class="note green"><strong>对照检查</strong><p>不用给 K、敢标噪声、认任意形状——这是 DBSCAN 的出发点（p71）。你的纸上结果：核心／边界／噪声名单、簇成员都对上了吗？图中：绿＝簇 1，橙＝簇 2，黑虚线＝噪声。</p></div></div>';
    }
    const rows = parts.map((part, pi) => {
      const res = results[pi];
      const cls = res.clusters.map(cl => '{' + cl.slice().sort((a, b) => a - b).map(i => q.points[i].name).join(',') + '}').join(' ＋ ');
      const nCore = res.core.filter(Boolean).length;
      const nBorder = res.verdicts.filter(v => v === 'border').length;
      return '<tr><td>' + part.label + '</td><td>' + res.clusters.length + '</td><td class="soft">' + cls + '</td><td>' + nCore + '</td><td>' + nBorder + '</td><td>' + (res.noise.length ? res.noise.map(i => q.points[i].name).join('、') : '无') + '</td></tr>';
    }).join('');
    return '<div class="step-block"><h3>最终对照 · 同一份数据，两种 Eps</h3>' +
      '<div class="table-wrap"><table class="trace"><thead><tr><th>参数</th><th>簇数</th><th>簇成员</th><th>核心</th><th>边界</th><th>噪声</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="note"><strong>Eps 变小改变了什么？</strong><p>桥还在：(b) 里 B–G–D 仍相连（d²=9≤9），所以还是一个簇；但 A、E 从核心降为边界，C（原边界）、F（原核心）掉成噪声。邻域半径决定密度链连不连得上——这就是参数敏感性。图按 (b) 着色：黑虚线＝噪声 C、F。</p></div></div>';
  }

  function buildKmeansSteps(q, sol) {
    const steps = [], meta = [];
    sol.rounds.forEach((r, ri) => {
      steps.push(assignStep(q, sol, r, ri));
      meta.push({ type: 'assign', ri, title: '第 ' + (ri + 1) + ' 轮 · 分配（距离表）' });
      if (r.changed) {
        steps.push(updateStep(q, r, ri));
        meta.push({ type: 'update', ri, title: '第 ' + (ri + 1) + ' 轮 · 更新中心（星移动）' });
      }
    });
    steps.push(finalStep(q, sol));
    meta.push({ type: 'final', title: '最终结果 · 簇 / 中心 / loss' });
    return { steps, meta };
  }

  function buildDbsSteps(q, results) {
    const steps = [], meta = [];
    q.parts.forEach((part, pi) => {
      steps.push(dbsMatrixStep(q, part, results[pi]));
      meta.push({ type: 'matrix', pi, title: part.label + ' · d² 矩阵（邻域连线）' });
      steps.push(dbsClassifyStep(q, part, results[pi]));
      meta.push({ type: 'classify', pi, title: part.label + ' · 核心/边界/噪声判定' });
      steps.push(dbsExpandStep(q, part, results[pi]));
      meta.push({ type: 'expand', pi, title: part.label + ' · 扩簇（按簇着色）' });
    });
    steps.push(dbsFinalStep(q, q.parts, results));
    meta.push({ type: 'final', title: q.parts.length > 1 ? '最终对照 · 两种 Eps' : '最终结果 · 簇与噪声' });
    return { steps, meta };
  }

  const BUILT = QUESTIONS.map((q, i) => buildKmeansSteps(q, SOL[i]))
    .concat(DBS_QUESTIONS.map((q, i) => buildDbsSteps(q, DBS_SOL[i])));
  const STEPS = BUILT.map(b => b.steps);
  const META = BUILT.map(b => b.meta);

  const BLANK = '<div class="note blue blank-note"><strong>空白卷 · 答案未揭示</strong><p>先在纸上算，再点「揭示下一步」：散点图会动画演示这一步，下面的步骤面板原地更新距离表与公式，不会越堆越长。「上一步」可回退，「直达结果」跳到最终答案，「收起答案」回到空白卷。</p></div>';

  /* ---- 散点图：一次构建，逐步更新（CSS transition 动画） ---- */

  function kmScatterSvg(q) {
    const pts = q.points;
    const xs = pts.map(p => p.x).concat(q.init.map(c => c[0]));
    const ys = pts.map(p => p.y).concat(q.init.map(c => c[1]));
    const fr = plotFrame(xs, ys);
    let g = fr.g;
    q.init.forEach((c, k) => {
      g += '<g class="km-ghost" data-ghost="' + k + '" style="transform:translate(' + fr.X(c[0]) + 'px,' + fr.Y(c[1]) + 'px);opacity:0"><path d="' + starPath(0, 0, 13) + '" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/></g>';
    });
    pts.forEach((p, i) => {
      g += '<g class="km-pt" data-pt="' + i + '" style="transform:translate(' + fr.X(p.x) + 'px,' + fr.Y(p.y) + 'px)"><circle r="9" fill="#64748b" stroke="#fff" stroke-width="2"/><text x="13" y="-11" font-size="20" font-weight="700" fill="#102344">' + p.name + '</text></g>';
    });
    q.init.forEach((c, k) => {
      g += '<g class="km-star" data-star="' + k + '" style="transform:translate(' + fr.X(c[0]) + 'px,' + fr.Y(c[1]) + 'px)"><path d="' + starPath(0, 0, 15) + '" fill="' + COLORS[k] + '" stroke="' + DARK[k] + '" stroke-width="1.5"/><text x="17" y="22" font-size="20" font-weight="800" fill="' + DARK[k] + '">c' + (k + 1) + '</text></g>';
    });
    return { html: '<div class="km-wrap"><svg viewBox="0 0 640 520" role="img" aria-label="题目数据点与中心的散点图">' + g + '</svg></div>', X: fr.X, Y: fr.Y };
  }

  function dbsScatterSvg(q, results) {
    const pts = q.points;
    const fr = plotFrame(pts.map(p => p.x), pts.map(p => p.y));
    let g = fr.g;
    q.parts.forEach((part, pi) => {
      const eps2 = part.eps * part.eps;
      let idx = 0;
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          if (results[pi].D[i][j] <= eps2) {
            g += '<line class="dbs-edge" data-part="' + pi + '" x1="' + fr.X(pts[i].x) + '" y1="' + fr.Y(pts[i].y) + '" x2="' + fr.X(pts[j].x) + '" y2="' + fr.Y(pts[j].y) + '" stroke="#93b4e6" stroke-width="2.5" style="opacity:0;transition-delay:' + (idx * 50) + 'ms"/>';
            idx++;
          }
        }
      }
    });
    pts.forEach((p, i) => {
      g += '<g class="km-pt" data-pt="' + i + '" style="transform:translate(' + fr.X(p.x) + 'px,' + fr.Y(p.y) + 'px)"><circle r="9" fill="#64748b" stroke="#fff" stroke-width="2"/><text x="13" y="-11" font-size="20" font-weight="700" fill="#102344">' + p.name + '</text></g>';
    });
    return { html: '<div class="km-wrap"><svg viewBox="0 0 640 520" role="img" aria-label="题目数据点的散点图">' + g + '</svg></div>', X: fr.X, Y: fr.Y };
  }

  const SCATTER = QUESTIONS.map(kmScatterSvg).concat(DBS_QUESTIONS.map((q, i) => dbsScatterSvg(q, DBS_SOL[i])));

  function paintPoint(g, fill, noise) {
    const c = g.querySelector('circle');
    c.setAttribute('fill', fill);
    if (noise) { c.setAttribute('stroke', NOISE); c.setAttribute('stroke-dasharray', '4 3'); }
    else { c.setAttribute('stroke', '#fff'); c.removeAttribute('stroke-dasharray'); }
  }

  function applyKmScatter(qi, n) {
    const q = QUESTIONS[qi], sol = SOL[qi], sc = SCATTER[qi];
    const root = document.getElementById(q.id);
    const m = n === 0 ? null : META[qi][n - 1];
    let assign = null, centers = q.init, ghosts = false;
    if (m) {
      if (m.type === 'assign') { assign = sol.rounds[m.ri].assign; centers = sol.rounds[m.ri].centers; }
      else if (m.type === 'update') { assign = sol.rounds[m.ri].assign; centers = sol.rounds[m.ri].next; }
      else { assign = sol.final.assign; centers = sol.final.centers; ghosts = true; }
    }
    root.querySelectorAll('.km-pt').forEach(g => {
      const i = +g.dataset.pt;
      paintPoint(g, assign ? COLORS[assign[i]] : '#64748b', false);
    });
    root.querySelectorAll('.km-star').forEach(g => {
      const k = +g.dataset.star;
      g.style.transform = 'translate(' + sc.X(centers[k][0]) + 'px,' + sc.Y(centers[k][1]) + 'px)';
    });
    root.querySelectorAll('.km-ghost').forEach(g => { g.style.opacity = ghosts ? '1' : '0'; });
  }

  function applyDbsScatter(qi, n) {
    const q = DBS_QUESTIONS[qi - 2], results = DBS_SOL[qi - 2];
    const root = document.getElementById(q.id);
    const m = n === 0 ? null : META[qi][n - 1];
    const pi = m ? (m.type === 'final' ? results.length - 1 : m.pi) : -1;
    root.querySelectorAll('.dbs-edge').forEach(l => {
      const lp = +l.dataset.part;
      let op = 0;
      if (m && lp === pi) op = (m.type === 'matrix' || m.type === 'classify') ? 0.6 : (m.type === 'expand' ? 0.18 : 0);
      l.style.opacity = op;
    });
    root.querySelectorAll('.km-pt').forEach(g => {
      const i = +g.dataset.pt;
      if (!m || m.type === 'matrix') { paintPoint(g, '#64748b', false); return; }
      const res = results[pi];
      if (m.type === 'classify') {
        const v = res.verdicts[i];
        paintPoint(g, v === 'core' ? CORE_BLUE : (v === 'border' ? COLORS[1] : NOISE), v === 'noise');
      } else {
        const l = res.labels[i];
        paintPoint(g, l === -1 ? NOISE : (COLORS[l] || COLORS[0]), l === -1);
      }
    });
    const hint = root.querySelector('.km-hint');
    if (!m) hint.textContent = '圆点＝数据点。点「揭示下一步」：邻域连线浮现 → 按判定着色 → 按簇着色。';
    else if (m.type === 'matrix') hint.textContent = '连线＝邻域边（d²≤Eps²，含等号）；圆点尚未判定。';
    else if (m.type === 'classify') hint.textContent = '蓝＝核心，琥珀＝边界，黑虚线＝噪声；连线＝邻域。';
    else hint.textContent = '绿＝簇 1，橙＝簇 2，黑虚线＝噪声。' + (q.parts.length > 1 && m.type === 'final' ? '图按 (b) Eps=3 着色。' : '');
  }

  /* ---- 渲染与控制 ---- */

  function revealBar(qi) {
    const total = STEPS[qi].length;
    let dots = '<button class="step-dot" data-act="jump" data-q="' + qi + '" data-step="0">卷</button>';
    for (let k = 1; k <= total; k++) dots += '<button class="step-dot" data-act="jump" data-q="' + qi + '" data-step="' + k + '">' + k + '</button>';
    return '<div class="reveal-bar">' +
      '<button data-act="prev" data-q="' + qi + '">上一步</button>' +
      '<button class="primary" data-act="next" data-q="' + qi + '">揭示下一步</button>' +
      '<button data-act="final" data-q="' + qi + '">直达结果</button>' +
      '<button data-act="reset" data-q="' + qi + '">收起答案</button>' +
      '<span class="step-count"></span></div>' +
      '<div class="step-nav"><span class="step-title"></span><div class="step-dots">' + dots + '</div></div>';
  }

  function questionShell(qi, scatterHtml, tasksHtml) {
    const q = ALL[qi];
    const ptRows = q.points.map(p => '<tr><td>' + p.name + '</td><td>(' + p.x + ', ' + p.y + ')</td></tr>').join('');
    const given = qi < 2
      ? '<div class="chips given"><span class="chip"><b>K</b>&nbsp;= 2</span><span class="chip"><b>初始中心</b>&nbsp;c₁ = ' + fmtC(q.init[0]) + '，c₂ = ' + fmtC(q.init[1]) + '</span><span class="chip"><b>距离</b>&nbsp;欧氏（比 d² 即可）</span></div>'
      : '<div class="chips given"><span class="chip"><b>MinPts</b>&nbsp;= ' + q.parts[0].minPts + '</span>' + q.parts.map(p => '<span class="chip"><b>' + p.label + '</b></span>').join('') + '<span class="chip"><b>邻域</b>&nbsp;d≤Eps，含自己，取等号算</span></div>';
    const hint = qi < 2 ? '星＝中心（c₁ 绿／c₂ 橙），圆点＝数据点；揭示时星会移动、点会变色。' : '圆点＝数据点。点「揭示下一步」：邻域连线浮现 → 按判定着色 → 按簇着色。';
    return '<section class="panel qpanel" id="' + q.id + '">' +
      '<div class="qhead"><h2>' + q.title + '</h2><span class="qtag">' + q.tag + '</span></div>' +
      '<p class="qprompt">' + q.prompt + '</p>' + given +
      '<div class="grid2 qgrid"><div>' + scatterHtml + '<p class="km-hint">' + hint + '</p></div>' +
      '<div><div class="table-wrap"><table class="trace"><thead><tr><th>点</th><th>坐标 (x, y)</th></tr></thead><tbody>' + ptRows + '</tbody></table></div>' + tasksHtml + '</div></div>' +
      revealBar(qi) +
      '<div class="step-view" aria-live="polite"></div></section>';
  }

  const KM_TASKS = '<div class="note blue tasks"><strong>手算任务</strong><p>① 逐轮：算 d²、分配 → 求均值、更新中心；</p><p>② 每轮检查有没有点改归属，哪一轮收敛？</p><p>③ 写出最终两个簇的成员与中心；</p><p>④ 算 loss＝每个点到其中心距离的平方和。</p></div>';
  const DBS_TASKS = '<div class="note blue tasks"><strong>手算任务</strong><p>① 逐对算 d²，标出邻域（d²≤Eps²）；</p><p>② 数邻域点数（含自己），与 MinPts 比，判核心／边界／噪声；</p><p>③ 从核心点沿密度可达链扩簇，边界收编、噪声排除；</p><p>④ 给出最终的簇与噪声名单。</p></div>';

  function applyStep(qi) {
    const q = ALL[qi], n = state.step[qi], total = STEPS[qi].length;
    const root = document.getElementById(q.id);
    const view = root.querySelector('.step-view');
    view.innerHTML = n === 0 ? BLANK : STEPS[qi][n - 1];
    view.classList.remove('swap-in');
    void view.offsetWidth;
    view.classList.add('swap-in');
    view.scrollTop = 0;
    root.querySelector('[data-act="prev"]').disabled = n === 0;
    root.querySelector('[data-act="next"]').disabled = n >= total;
    root.querySelector('[data-act="final"]').disabled = n >= total;
    root.querySelector('[data-act="reset"]').disabled = n === 0;
    root.querySelector('.step-count').textContent = n === 0 ? '空白卷 · 共 ' + total + ' 步' : '第 ' + n + ' / ' + total + ' 步';
    root.querySelector('.step-title').textContent = n === 0 ? '先手算，再逐步揭示' : META[qi][n - 1].title;
    root.querySelectorAll('.step-dot').forEach(d => {
      const k = +d.dataset.step;
      if (k === n) d.setAttribute('aria-current', 'true'); else d.removeAttribute('aria-current');
      d.classList.toggle('done', k > 0 && k < n);
    });
    if (qi < 2) applyKmScatter(qi, n); else applyDbsScatter(qi, n);
  }

  function render() {
    document.getElementById('quizRoot').innerHTML =
      '<div class="note blue howto"><strong>K-Means 怎么手算（第 1–2 题前先看）</strong>' +
      '<p>① 欧氏距离 d = √((x−cₓ)²+(y−c_y)²)。比较远近只需比 d²，不必开方。</p>' +
      '<p>② 每轮两步：分配（每个点归最近中心）→ 更新（中心＝成员坐标的算术均值）。</p>' +
      '<p>③ 停止条件：某一轮没有任何点改归属——中心不再变化，算法收敛。</p>' +
      '<p>④ loss＝每个点到其所属中心距离的平方和。</p>' +
      '<p>⑤ 先在纸上算，再点「揭示下一步」：图动画演示＋距离表原地更新，一步一屏，不堆叠。</p></div>' +
      '<div class="sec-head"><h2>A · K-Means 手算</h2><span>第 1–2 题 · 每轮两步：分配 → 更新</span></div>' +
      questionShell(0, SCATTER[0].html, KM_TASKS) +
      questionShell(1, SCATTER[1].html, KM_TASKS) +
      '<div class="note blue howto"><strong>DBSCAN 怎么手算（第 3–4 题前先看）</strong>' +
      '<p>① 邻域＝d≤Eps 的点（含自己，恰好等于也算）；比较用 d²≤Eps²。</p>' +
      '<p>② 核心点＝邻域点数 ≥ MinPts；边界点＝不足但半径内有核心；噪声＝既非核心也非边界。</p>' +
      '<p>③ 从核心点沿密度可达链扩簇；边界点被收编但不再外扩；噪声不进任何簇。</p>' +
      '<p>④ 不用给 K——簇数由密度决定。</p></div>' +
      '<div class="sec-head"><h2>B · DBSCAN 手算</h2><span>第 3–4 题 · 邻域 → 判定 → 扩簇</span></div>' +
      questionShell(2, SCATTER[2].html, DBS_TASKS) +
      questionShell(3, SCATTER[3].html, DBS_TASKS);
    for (let qi = 0; qi < 4; qi++) applyStep(qi);
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const qi = +b.dataset.q, act = b.dataset.act, total = STEPS[qi].length;
    if (act === 'next') state.step[qi] = Math.min(total, state.step[qi] + 1);
    else if (act === 'prev') state.step[qi] = Math.max(0, state.step[qi] - 1);
    else if (act === 'final') state.step[qi] = total;
    else if (act === 'reset') state.step[qi] = 0;
    else if (act === 'jump') state.step[qi] = Math.max(0, Math.min(total, +b.dataset.step));
    else return;
    applyStep(qi);
    if (act === 'next' || act === 'jump') {
      document.getElementById(ALL[qi].id).querySelector('.step-view').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });

  render();
})();
</script>
</body>
</html>
