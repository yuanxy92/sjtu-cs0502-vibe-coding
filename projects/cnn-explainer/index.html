  <body>

    <style>
      /* 课程横幅：与「神经网络游乐场」「数据可视化实验室」同一套样式 */
      :root { --course-accent: #0b6e4f; }
      .course-banner {
        background: linear-gradient(180deg, #f4f8f6 0%, #ffffff 100%);
        border-bottom: 1px solid #dfe7e3;
        padding: 22px 0 18px 0;
      }
      .course-banner .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
      .course-banner h1 {
        font-size: 30px; font-weight: 500; margin: 0 0 8px 0; color: #14322a; letter-spacing: .5px;
      }
      .course-banner h1 b { color: var(--course-accent); font-weight: 700; }
      .course-banner p { margin: 4px 0; color: #3c5a50; font-size: 15px; line-height: 1.7; }
      .course-banner .course-meta { font-size: 13px; color: #6b857c; margin-top: 10px; }
      .course-banner .course-meta a { color: var(--course-accent); }

      .course-attribution {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
        display: flex; gap: 14px; align-items: center; justify-content: center;
        flex-wrap: wrap;
        padding: 7px 14px; font-size: 12.5px; line-height: 1.5;
        background: rgba(255, 255, 255, .94); color: #556;
        border-top: 1px solid rgba(0, 0, 0, .08);
      }
      .course-attribution a { color: #1a6fb5; }
      .course-attribution .sep { color: #bbb; }

      /* 换成我们自己的页头：藏掉上���原有的黑色标题栏（角上的 arXiv / YouTube / GitHub 外链
         也在里面）以及推荐位组件，只留可交互的部分 */
      div.svelte-qob9ex,
      recommender-overlay { display: none !important; }

      /* 讲解文章（纯文字 + 配图）收起来，只留交互式可视化：
         保留 div.overview（网络总览图）与 #detailview-container（逐层讲解器），
         标题、段落、图注、示意图、视频区块全部隐藏。
         （配图 assets/figures/*.gif 有 10MB，按需要不随页面发布） */
      .svelte-1avhf6 h2,
      .svelte-1avhf6 h4,
      .svelte-1avhf6 h6,
      .svelte-1avhf6 p:not(:has(#detailview-container)),
      .svelte-1avhf6 ol,
      .svelte-1avhf6 ul,
      .svelte-1avhf6 div.figure,
      .svelte-1avhf6 div.video { display: none !important; }

      /* 交互部分居中 */
      .svelte-1avhf6 { max-width: 1180px; margin: 0 auto !important; }
      div.overview { margin: 0 auto; }
      #detailview-container { margin: 0 auto; }
      body { padding-bottom: 34px; }
    </style>
    <div class="course-banner">
      <div class="container">
        <h1>逐层看<b>卷积网络</b>在做什么</h1>
        <p>输入在最左，输出在最右；点中间任意一层，就能看到这一层把图像变成了什么。
           也可以上传自己的图片，看它被分到哪一类。</p>
        <p class="course-meta">
          计算机科学导论 · 卷积网络 ｜
          <a href="../../index.html">← 返回课程主页</a> ｜
          改编自 CNN Explainer（MIT）
        </p>
      </div>
    </div>

        论文见 <a href="https://arxiv.org/abs/2004.15004" target="_blank" rel="noopener">arXiv:2004.15004</a>。课程教学使用，谨致谢意。</span>
    </div>
