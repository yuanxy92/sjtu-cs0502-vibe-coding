<body>
<main class="app">
 <header><h1>锁与死锁实验室</h1><p class="subtitle">先用打印室理解锁，再看两把锁如何互相等住。</p></header>
 <div class="tabs" role="tablist" aria-label="实验场景"><button id="tab-lock" role="tab" aria-selected="true" aria-controls="experiment" data-scene="lock">① 锁为什么需要原子操作</button><button id="tab-deadlock" role="tab" aria-selected="false" aria-controls="experiment" data-scene="deadlock">② 两把锁怎样形成死锁</button></div>
 <section id="experiment" role="tabpanel" aria-labelledby="tab-lock">
  <div class="toolbar"><div class="mode-switch" aria-label="实验方案"><span>演示方式：</span><button id="mode1" type="button"></button><button id="mode2" type="button"></button></div><div class="playback"><button id="nextBtn" class="primary" type="button">下一步</button><button id="playBtn" type="button">自动演示</button><button id="resetBtn" type="button">重置</button></div><label class="speed">播放间隔 <select id="speed"><option value="1600">1600 ms</option><option value="900" selected>900 ms</option><option value="400">400 ms</option></select><span id="stepCount" class="step-count">第 0 步</span></label></div>
  <div id="outcome" class="outcome" role="status" aria-live="polite"><div><strong id="outcomeTitle"></strong><p id="outcomeText"></p></div><button id="fixBtn" type="button" hidden></button></div>
  <div class="world">
   <div class="lock-lesson" id="lockWorld">
    <p class="printer-story">打印室一次只能进一个人。出门后，把牌子翻回“无人”。</p>
    <div class="room-scene">
     <section class="outside"><h2>门外</h2><div id="outsidePeople" class="people-area"><section id="readerP1" data-reader="P1"></section><section id="readerP2" data-reader="P2"></section></div></section>
     <div class="lock-variable shared-sign"><h2>打印室门口的牌子</h2><strong id="signState">无人</strong></div>
     <section class="critical-zone" id="criticalZone"><h2>打印室 <small>限 1 人</small></h2><div class="occupants people-area" id="occupants"></div></section>
    </div>
    <p class="lesson-point" id="simplePoint"></p>
   </div>
   <div id="graphWorld" hidden><div class="graph-scroll" tabindex="0" role="region" aria-label="可左右滚动的锁与进程关系图"><svg class="graph" id="graph" viewBox="0 0 1000 280" role="img" aria-label="锁与进程的持有、请求关系"></svg></div><p class="graph-legend">实线：锁 → 持有者；红色虚线：进程 → 正在请求的锁。</p></div>
  </div>
  <details id="lockDetails" class="explain-toggle"><summary>查看原理、代码与执行记录</summary>
   <p class="muted">“无人”对应锁变量 L = 0，“有人”对应 L = 1。当前 <span id="lockValue">L = 0</span>。小蓝是 P1，小绿是 P2。</p>
   <div class="atomic-picture" id="atomicPicture"></div>
   <div class="manual-controls"><span>自行选择执行顺序：</span><button type="button" data-manual="P1">推进小蓝（P1）</button><button type="button" data-manual="P2">推进小绿（P2）</button></div>
   <section class="trace-section"><h3>执行顺序</h3><div class="trace-scroll" tabindex="0" role="region" aria-label="两进程执行顺序"><table class="trace-table" id="lockTrace"></table></div><p class="trace-hint" id="traceHint"></p></section>
   <div class="actors" id="lockCode"></div>
   <ol class="log" id="lockLog"></ol>
  </details>
  <div class="actors" id="actors"></div>
  <section class="conditions" id="conditions" hidden><h3>死锁的四个必要条件（本例中，每把锁都只有一份）</h3><div class="condition-grid" id="conditionGrid"></div></section>
  <p class="takeaway" id="takeaway"></p>
  <details id="deadlockDetails" class="explain-toggle"><summary>查看执行记录与课堂提问</summary><p class="muted" id="question" style="margin-top:9px"></p><ol class="log" id="log"></ol></details>
 </section>
 <footer class="footer"><span>教学伪代码 · 两个进程交替执行 · 切换场景或方案会重置</span><a href="README.md">教师演示说明</a></footer>
</main>
<script id="lab-engine">
(() => {

 function create(scene='lock',mode=scene==='lock'?'split':'opposite') {
  if(!['lock','deadlock'].includes(scene)||!(scene==='lock'?['split','atomic']:['opposite','ordered']).includes(mode))throw new Error('Unknown experiment');
  return {scene,mode,actors:['P1','P2'].map(id=>({id,pc:0,read:null,status:'ready',held:[],waiting:null})),lock:0,claims:[],locks:{A:null,B:null},steps:0,turn:'P1',history:[],deadlocked:false,hadViolation:false,done:false};
 }
 const order=(s,id)=>s.mode==='opposite'&&id==='P2'?['B','A']:['A','B'];
 function program(s,id) {
  if(s.scene==='lock')return s.mode==='split'?['if (L == 0)  // 读锁并判断','L = 1       // 单独置位','进入临界区','离开临界区；L = 0']:['if (atomic_exchange(L, 1) == 0)','进入临界区','离开临界区；L = 0'];
  const [a,b]=order(s,id);return [`lock(${a})`,`lock(${b})`,'使用两项资源',`unlock(${b})`,`unlock(${a})`];
 }
 function cycle(s) {
  const [a,b]=s.actors;
  return Boolean(a.waiting&&b.waiting&&s.locks[a.waiting]===b.id&&s.locks[b.waiting]===a.id);
 }
 function conditions(s){return {mutual:true,holdWait:s.actors.some(p=>p.waiting&&p.held.length>0),noPreempt:true,circular:cycle(s)}}
 function edges(s){
  const list=[];for(const name of ['A','B'])if(s.locks[name])list.push({from:name,to:s.locks[name],kind:'held'});
  for(const p of s.actors)if(p.waiting)list.push({from:p.id,to:p.waiting,kind:'request'});
  return list;
 }
 function step(s,id) {
  const p=s.actors.find(p=>p.id===id);
  if(!p||s.done||s.deadlocked||s.hadViolation||p.status==='done'||p.status==='waiting')return s;
  let text='',kind='step',op=null;const before=s.lock;
  if(s.scene==='lock') {
   if(p.pc===0){
    op=s.mode==='atomic'?'exchange':'read';
    const old=s.lock;p.read=old;
    if(s.mode==='atomic')s.lock=1;
    if(old===0){p.pc=1;p.status='ready';if(s.mode==='atomic')s.claims.push(id);}
    else p.status='spinning';
    text=s.mode==='atomic'?`原子交换：读取旧值 ${old}，同时把 L 写为 1。${old===0?'抢锁成功。':'抢锁失败，留在此行重试。'}`:`读到 L = ${old}。${old===0?'判断空闲，准备下一步置位；此刻尚未写锁。':'锁被占用，留在此行重试。'}`;
   } else if(s.mode==='split'&&p.pc===1){
    op='write';
    s.lock=1;s.claims.push(id);p.pc=2;p.status='ready';text='依据刚才读到的 0，把 L 写成 1；没有重新检查。';
   } else if(p.pc===(s.mode==='split'?2:1)){
    op='enter';
    p.pc++;p.status='critical';text='进入临界区。';kind='enter';
   } else {
    op='release';
    p.pc++;p.status='done';s.lock=0;s.claims=s.claims.filter(owner=>owner!==id);text='离开临界区，把 L 写为 0，释放锁。';kind='release';
   }
   s.hadViolation=s.actors.filter(a=>a.status==='critical').length>1;
  } else {
   const locks=order(s,id);
   if(p.pc<2){
    const name=locks[p.pc],owner=s.locks[name];
    if(owner===null){s.locks[name]=id;p.held.push(name);p.pc++;p.status='ready';text=`原子获取锁 ${name} 成功；${id} 现在持有 ${p.held.join('、')}。`;kind='acquire';}
    else {p.status='waiting';p.waiting=name;text=`请求锁 ${name}，但它由 ${owner} 持有。${id} 阻塞，仍保留已持有的锁。`;kind='wait';}
   } else if(p.pc===2){p.pc++;text='已经拿到两把锁，可以使用资源。';kind='work';}
   else {
    const name=locks[p.pc===3?1:0];
    if(s.locks[name]!==id)throw new Error('Only the owner may unlock');
    s.locks[name]=null;p.held=p.held.filter(held=>held!==name);p.pc++;p.status=p.pc===5?'done':'ready';
    const woke=[];
    for(const waiter of s.actors)if(waiter.waiting===name){waiter.waiting=null;waiter.status='ready';woke.push(waiter.id);}
    text=`主动释放锁 ${name}。${woke.length?`${woke.join('、')} 被唤醒，可以重试获取；锁不会自动转交。`:''}`;kind='release';
   }
   s.deadlocked=cycle(s);
  }
  s.steps++;s.turn=id==='P1'?'P2':'P1';s.done=s.actors.every(a=>a.status==='done');
  s.history.push({n:s.steps,id,text,kind,...(s.scene==='lock'?{op,before,after:s.lock,observed:p.read}:{})});return s;
 }
 function nextActor(s){
  if(s.done||s.deadlocked||s.hadViolation)return null;
  const choices=[s.turn,s.turn==='P1'?'P2':'P1'];
  return choices.find(id=>{const p=s.actors.find(p=>p.id===id);return p.status!=='waiting'&&p.status!=='done'})||null;
 }
 function next(s){const id=nextActor(s);return id?step(s,id):s}

})();

<script id="lab-interface">

 function actorInfo(p){
  if(state.scene==='lock')return p.status==='done'?'已释放锁并完成':`刚才读到：${p.read===null?'尚未读取':p.read}${p.status==='spinning'?' · 自旋重试':''}`;
  return `${p.held.length?'持有 '+p.held.join('、'):'未持有锁'}${p.waiting?'；等待 '+p.waiting:''}`;
 }
 function renderActors(){
  const root=$(state.scene==='lock'?'lockCode':'actors');root.replaceChildren();
  $('actors').hidden=state.scene==='lock';
  for(const p of state.actors){
   const article=el('section',`actor ${p.id==='P2'?'p2':''}`);article.dataset.actor=p.id;
   const head=el('header','actor-header');head.append(el('h2','',`${p.id}（进程 ${p.id.slice(1)}）`),el('span','actor-status',({ready:'可运行',critical:'临界区内',spinning:'正在重试',waiting:'阻塞等待',done:'已完成'})[p.status]));
   const code=el('ol','code');for(const [i,line]of L.program(state,p.id).entries()){
    const row=el('li',p.pc===i?(p.status==='waiting'?'active waiting':'active'):p.pc>i?'past':'');row.dataset.line=i;row.append(el('code','',line));code.append(row);
   }
   const bottom=el('div','actor-bottom'),button=el('button','',`推进 ${p.id}`);button.type='button';button.dataset.step=p.id;
   button.disabled=playing||terminal()||p.status==='waiting'||p.status==='done';button.addEventListener('click',()=>advance(p.id));
   bottom.append(el('span','actor-info',actorInfo(p)));if(state.scene==='deadlock')bottom.append(button);article.append(head,code,bottom);root.append(article);
  }
 }
 function render(){
  document.querySelectorAll('[data-scene]').forEach(button=>{button.setAttribute('aria-selected',String(button.dataset.scene===state.scene))});
  $('experiment').setAttribute('aria-labelledby',`tab-${state.scene}`);
  modes[state.scene].forEach(([mode,label],i)=>{const button=$(`mode${i+1}`);button.textContent=label;button.classList.toggle('selected',mode===state.mode);button.setAttribute('aria-pressed',String(mode===state.mode));});
  $('stepCount').textContent=`第 ${state.steps} 步`;
  $('nextBtn').disabled=terminal()||playing;$('playBtn').disabled=terminal();$('playBtn').textContent=playing?'暂停':'自动演示';
  $('nextBtn').textContent='下一步';
  $('lockDetails').hidden=state.scene!=='lock';$('deadlockDetails').hidden=state.scene==='lock';$('takeaway').hidden=state.scene==='lock';
  document.querySelectorAll('[data-manual]').forEach(b=>{b.disabled=playing||terminal()||state.actors.find(p=>p.id===b.dataset.manual).status==='done'});
  const info=state.scene==='lock'?simpleBanner():banner();$('outcome').className=`outcome ${info.style}`;$('outcomeTitle').textContent=info.title;$('outcomeText').textContent=info.text;
  $('fixBtn').hidden=!state.hadViolation&&!state.deadlocked;$('fixBtn').textContent=state.scene==='lock'?'改用原子操作再试':'统一拿锁顺序再试';
  $('lockWorld').hidden=state.scene!=='lock';$('graphWorld').hidden=state.scene!=='deadlock';$('conditions').hidden=state.scene!=='deadlock';
  if(state.scene==='lock')drawSingle();else drawGraph();renderActors();
  const conditions=L.conditions(state),descriptions={mutual:['互斥','每把锁同时只能由一个进程持有。'],holdWait:['占有并等待','拿着已有的锁，又在等另一把锁。'],noPreempt:['不可剥夺','模型只允许持有者主动释放锁。'],circular:['循环等待','P1 等 P2，P2 又等 P1。']};
  const grid=$('conditionGrid');grid.replaceChildren();for(const [key,[title,detail]]of Object.entries(descriptions)){const node=el('div',`condition ${key==='circular'?'cycle':''} ${conditions[key]?'met':''}`);node.dataset.condition=key;node.append(el('strong','',`${conditions[key]?'✓':'○'} ${title}`),el('span','',detail));grid.append(node)}
  $('takeaway').textContent=state.scene==='lock'?'原子操作保证“看牌子＋设成有人”的中间无法插入别人。只有看到原先是“无人”的那个人获准进入。':'这一幕讲“死锁”：单把锁的获取是原子的，但两把锁不是一次一起获得。统一先 A 后 B，可以破坏循环等待。';
  $('question').textContent=state.scene==='lock'?'课堂提问：为什么两次都读到 0，却不能让两个人都进入？如果只把“写 1”做成原子操作，够不够？':'课堂提问：一个进程等待就是死锁吗？已拿着一把锁的进程，为什么不能执行后面的 unlock？统一先 A 后 B 破坏了哪个条件？';
  const log=$(state.scene==='lock'?'lockLog':'log');log.replaceChildren();for(const entry of state.history.slice().reverse()){const row=el('li');row.append(el('span','',`第 ${entry.n} 步`),el('span','',`${entry.id}：${entry.text}`));log.append(row)}
 }
 document.querySelectorAll('[data-scene]').forEach(button=>button.addEventListener('click',()=>reset(button.dataset.scene,button.dataset.scene==='lock'?'split':'opposite')));
 [$('mode1'),$('mode2')].forEach((button,i)=>button.addEventListener('click',()=>reset(state.scene,modes[state.scene][i][0])));
 $('nextBtn').addEventListener('click',()=>advance());$('resetBtn').addEventListener('click',()=>reset());
 $('playBtn').addEventListener('click',()=>{if(playing)stop();else if(!terminal()){playing=true;schedule()}render()});
 $('speed').addEventListener('change',()=>{if(playing){clearTimeout(timer);timer=null;schedule()}});
 $('fixBtn').addEventListener('click',()=>reset(state.scene,state.scene==='lock'?'atomic':'ordered'));
 document.querySelectorAll('[data-manual]').forEach(b=>b.addEventListener('click',()=>advance(b.dataset.manual)));
 render();
})();
</script>
</body>
</html>
