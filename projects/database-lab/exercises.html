<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>课堂练习 · SQL</title>
<style>
:root{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:22px;
  line-height:1.45;
  color:#102344;
  background:#f6f8fc;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --red:#b91c1c;
  --amber:#b45309;
  --green:#15803d;
  --line:#d6deea;
  --muted:#53647c;
  --card:#fff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button{min-height:44px;padding:8px 18px;border:1px solid #bac8da;border-radius:7px;background:#fff;font-weight:650;transition:background-color .15s,transform .15s}
button:hover:not(:disabled){background:#eff5ff;border-color:#6c96e8}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,textarea:focus-visible{outline:3px solid #8eaff4;outline-offset:3px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.primary:hover:not(:disabled){background:var(--blue-dark)}
h1,h2,h3,p{margin:0}
h1{font-size:43px;line-height:1.15;letter-spacing:-.03em}
.app{max-width:1680px;margin:auto;padding:30px 40px 40px}
.app-header{display:grid;gap:8px}
.eyebrow{color:var(--blue);font-size:19px;font-weight:750;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:23px}
.offline{font-size:19px;color:var(--muted)}
.offline b{color:var(--green)}
.pagenav{display:flex;gap:10px;margin-top:6px}
.pagenav a{text-decoration:none}
.pagenav .cur{background:var(--blue);border-color:var(--blue);color:#fff}

.panel{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:22px 24px;margin-top:20px;min-width:0}
.panel h2{margin-bottom:10px;font-size:26px}
.muted{color:var(--muted);font-size:20px}

.databar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #c7d7ef;border-radius:20px;background:#f0f6ff;padding:6px 16px;font-size:19px;font-weight:650;color:#17427a}
.chip small{font-weight:600;color:var(--muted);font-size:17px}
.databar .spacer{flex:1}
.databar button{border-radius:20px;min-height:40px;padding:5px 14px;font-size:19px}
.databar button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.sizectrl{display:inline-flex;align-items:center;gap:6px;font-size:18px;color:var(--muted)}
.sizectrl input{width:96px;min-height:40px;padding:4px 10px;border:1px solid #bac8da;border-radius:7px;background:#fff;font-family:var(--mono);font-size:19px}
.sizectrl button{border-radius:20px;min-height:40px;padding:5px 14px;font-size:19px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px;background:#fff}
table.rel{border-collapse:collapse;width:100%;font-size:20px}
table.rel th{background:#eef3fb;color:#17427a;font-weight:750;padding:9px 14px;border-bottom:2px solid #c9d8ef;text-align:left;white-space:nowrap}
table.rel td{padding:8px 14px;border-bottom:1px solid #e6ecf5;white-space:nowrap}
table.rel td.num{font-family:var(--mono)}
table.rel .idx{color:var(--muted);font-weight:600;width:56px;background:#f6f8fc}
table.rel .empty td{color:var(--muted)}
.cmp table.rel th,.cmp table.rel td{padding:7px 12px;font-size:19px}
.cmp .better{color:var(--green);font-weight:750}
.cmp .worse{color:var(--red);font-weight:750}

/* exercises */
.exlist2{display:grid;gap:14px;margin-top:14px}
.ex{border:1px solid var(--line);border-radius:9px;background:#fff;padding:16px 20px}
.ex summary{font-size:22px;font-weight:750;color:#17427a}
.ex .q{font-size:20px;margin-top:10px}
.ex .q code{font-family:var(--mono);background:#f0f6ff;border:1px solid #c7d7ef;border-radius:5px;padding:0 6px;font-size:18px}
.ex textarea{width:100%;min-height:120px;font-family:var(--mono);font-size:19px;line-height:1.5;padding:12px;border:1px solid #bac8da;border-radius:8px;margin-top:12px;resize:vertical}
.ex .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ex .row button{min-height:40px;padding:5px 16px;font-size:19px;border-radius:20px}
.ex .fb{font-size:20px;font-weight:750;margin-top:10px}
.ex .fb.ok{color:var(--green)}
.ex .fb.no{color:var(--red)}
.ex .fb.info{color:var(--muted);font-weight:600}
.ex .hintbox,.ex .ansbox{display:none;margin-top:10px;border-left:3px solid #e6be66;background:#fff9eb;color:#854d0e;border-radius:0 8px 8px 0;padding:10px 14px;font-size:19px}
.ex .ansbox{border-left-color:#c7d7ef;background:#f0f6ff;color:#17427a}
.ex .ansbox code,.ex .hintbox code{font-family:var(--mono);font-size:18px}
.ex.pass summary::after{content:' ✓ 已通过';color:var(--green);font-size:18px;font-weight:750}
.ex .out{margin-top:12px}
.ex .out .tablewrap{max-height:320px;overflow:auto}
.ex .mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ex .mini span{border:1px solid var(--line);border-radius:7px;background:#f8fafd;padding:4px 12px;font-size:17px;color:var(--muted)}
.ex .mini b{font-family:var(--mono);color:#102344}
.ex .sqlerr{border:1px solid #f1a5ab;background:#fff1f2;color:#991b1b;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:19px}
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <p class="eyebrow">CS0502 · 计算机科学导论 · 数据库系统</p>
    <h1>课堂练习</h1>
    <p class="subtitle">每题都能直接运行、看输出表和执行指标；判分对比的是<b>运行结果</b>和<b>运行速度</b>，不是代码文本。</p>
    <p class="offline"><b>● 离线可用</b> · 界面中文 · 与 <a href="./index.html">SQL 平台</a> 使用同一个引擎</p>
    <nav class="pagenav" aria-label="页面切换">
      <a href="./index.html"><button type="button">← SQL 平台</button></a>
      <a><button type="button" class="cur" aria-current="page">课堂练习</button></a>
    </nav>
  </header>

  <div class="panel">
    <h2>作答数据</h2>
    <p class="muted">练习 1–7 按<b>课件示例数据</b>判分（保持默认即可）；练习 8「优化改写」建议切到随机大数据（学生 1000）感受差距——判分按<b>当前所选数据</b>现场运行参考查询，结果与速度都以它为准。</p>
    <div class="databar">
      <span class="chip" id="chipStudent"></span>
      <span class="chip" id="chipCourse"></span>
      <span class="chip" id="chipEnrolled"></span>
      <span class="spacer"></span>
      <button id="btnSmall" type="button" aria-pressed="true">课件示例数据</button>
      <button id="btnBig" type="button" aria-pressed="false">随机生成大数据</button>
      <span id="sizeCtrl" class="sizectrl" hidden>
        <label for="numStu">学生</label><input id="numStu" type="number" min="1" max="10000" value="1000">
        <label for="numCou">课程</label><input id="numCou" type="number" min="1" max="20" value="20">
        <button id="btnShuffle" type="button">重新生成</button>
      </span>
    </div>
  </div>

  <div class="panel">
    <h2>练习列表</h2>
    <div id="exercises" class="exlist2"></div>
  </div>

  <footer style="margin-top:30px;color:var(--muted);font-size:19px;text-align:center">课堂练习 · CS0502 Vibe Coding · 与课件《数据库》配套使用 · <a href="./index.html">返回 SQL 平台</a></footer>
</div>

<script src="./sql-engine.js"></script>
<script>
'use strict';
const E = window.SQLE;
const fmt = E.fmt;
let DATA = null, mode = 'small';

function setData(m){
  mode=m;
  DATA = m==='small' ? E.loadSlide() : E.loadRandom(document.getElementById('numStu').value, document.getElementById('numCou').value);
  renderChips();
  document.getElementById('btnSmall').setAttribute('aria-pressed', m==='small');
  document.getElementById('btnBig').setAttribute('aria-pressed', m==='big');
  document.getElementById('sizeCtrl').hidden = m!=='big';
}
function renderChips(){
  document.getElementById('chipStudent').innerHTML='Student <small>'+fmt(DATA.Student.rows.length)+' 行</small>';
  document.getElementById('chipCourse').innerHTML='Course <small>'+fmt(DATA.Course.rows.length)+' 行</small>';
  document.getElementById('chipEnrolled').innerHTML='Enrolled <small>'+fmt(DATA.Enrolled.rows.length)+' 行</small>';
}

/* ================= 题目 ================= */
const EXERCISES=[
  {t:'热身：按条件挑行（σ 选择）',
   q:'教务老师想列出所有 <b>90 分以上</b>的选课记录（全部列）。',
   expect:"SELECT * FROM Enrolled WHERE Grade > 90;",
   hint:'只需要一张表 Enrolled；SELECT 全部列用 *；挑行用 <code>WHERE Grade &gt; 90</code>。',
   ans:"SELECT * FROM Enrolled WHERE Grade > 90;"},
  {t:'只挑几列（π 投影）',
   q:'列出所有学生的<b>学号和姓名</b>（不要年龄）。',
   expect:"SELECT Sid, Sname FROM Student;",
   hint:'SELECT 后面写需要的列名，逗号分隔。',
   ans:"SELECT Sid, Sname FROM Student;"},
  {t:'选择 + 投影',
   q:'把 <b>88 分以上</b>的选课记录的<b>学号和成绩</b>列出来——先挑行还是先挑列？',
   expect:"SELECT Sid, Grade FROM Enrolled WHERE Grade >= 88;",
   hint:'一条 SQL 同时做两件事：SELECT 管列，WHERE 管行。',
   ans:"SELECT Sid, Grade FROM Enrolled WHERE Grade >= 88;"},
  {t:'两表连接：把名字找回来',
   q:'Enrolled 里只有学号。请列出 <b>90 分以上学生的姓名和成绩</b>（Student + Enrolled）。',
   expect:"SELECT Sname, Grade FROM Student S, Enrolled E WHERE S.Sid = E.Sid AND E.Grade > 90;",
   hint:'FROM 写两张表，WHERE 里先给连接条件 S.Sid = E.Sid，再给过滤条件。',
   ans:"SELECT Sname, Grade\nFROM Student S, Enrolled E\nWHERE S.Sid = E.Sid AND E.Grade > 90;"},
  {t:'三表连接（课件第 20 页同款）',
   q:'列出选了<b>“数据库”课</b>的学生的<b>姓名和成绩</b>（Student + Enrolled + Course）。',
   expect:"SELECT S.Sname, E.Grade FROM Student S, Enrolled E, Course C WHERE S.Sid = E.Sid AND C.Cid = E.Cid AND C.Cname = '数据库';",
   hint:'两条连接条件（S-E、E-C）+ 一条课程名过滤。',
   ans:"SELECT S.Sname, E.Grade\nFROM Student S, Enrolled E, Course C\nWHERE S.Sid = E.Sid AND C.Cid = E.Cid\n  AND C.Cname = '数据库';"},
  {t:'DISTINCT：去掉重复行',
   q:'有学生选了课的<b>课程名</b>有哪些？每门课只出现一次。',
   expect:"SELECT DISTINCT Cname FROM Enrolled NATURAL JOIN Course;",
   hint:'Enrolled 连接 Course 后每选课一条记录，同一门课会重复出现（回想 Excel 单表视图里 Cname 重复了多少次）；用 <code>SELECT DISTINCT</code> 去重。',
   ans:"SELECT DISTINCT Cname\nFROM Enrolled NATURAL JOIN Course;"},
  {t:'思考题：空集也是答案',
   q:'课件原题：查询选了<b>数据库</b>课、<b>年龄 20 岁以下</b>、成绩 <b>90 分以上</b>的学生姓名。写出来运行，看看结果是什么？',
   expect:"SELECT S.Sname FROM Student S, Enrolled E, Course C WHERE S.Sid = E.Sid AND C.Cid = E.Cid AND C.Cname = '数据库' AND S.Sage < 20 AND E.Grade > 90;",
   hint:'条件全部写进 WHERE。运行后别急着怀疑自己——仔细看看选了数据库的是谁、他们几岁。',
   ans:"SELECT Sname\nFROM Student S, Enrolled E, Course C\nWHERE S.Sid = E.Sid AND C.Cid = E.Cid\n  AND C.Cname = '数据库' AND S.Sage < 20\n  AND E.Grade > 90;\n\n结果是空集：数据库课 90 分以上的是赵万里（22 岁），\n20 岁以下的刘佳琪（70 分）和吕松（85 分）都没上 90。\nSQL 没错，是数据本身没有满足三个条件的学生。"},
  {t:'优化改写：同样的结果，更快的 SQL',
   q:'下面这条查询结果是对的，但很慢。<b>只允许调整 FROM 里表的顺序</b>，改写出一条<b>结果完全相同、但连接比较次数更少</b>的 SQL（WHERE 条件内容不变，可跟着表顺序挪动）。<br>建议先切到「随机生成大数据（学生 1000）」再对比指标。',
   slowSql:"SELECT S.Sname, C.Cname, E.Grade\nFROM Student S, Enrolled E, Course C\nWHERE S.Sid = E.Sid AND C.Cid = E.Cid\n  AND C.Cname = '数据库' AND E.Grade >= 90;",
   expect:"SELECT S.Sname, C.Cname, E.Grade\nFROM Course C, Enrolled E, Student S\nWHERE C.Cname = '数据库' AND C.Cid = E.Cid\n  AND E.Grade >= 90 AND E.Sid = S.Sid;",
   hint:'哪张表能最先被过滤到最小，就应该最先出场。把 <code>Course</code> 放到 FROM 最前面：Cname=「数据库」在第一张表扫描后就能立刻生效（谓词下推），后面每一步连接的都是被砍小后的结果。',
   ans:"SELECT S.Sname, C.Cname, E.Grade\nFROM Course C, Enrolled E, Student S\nWHERE C.Cname = '数据库' AND C.Cid = E.Cid\n  AND E.Grade >= 90 AND E.Sid = S.Sid;\n\n1000 学生规模下：连接比较约 550 万 → 6 万次（百倍级提速）。\n真实数据库的优化器会自动做这种重排——这正是课件优化树的思想。"},
  {t:'讨论题（不用写 SQL）：为什么快？',
   q:'第 8 题只是调了表的顺序，结果一模一样，速度却差几十上百倍——<b>为什么？</b>和课件里"选择下推"有什么关系？',
   discussion:'参考答案：引擎按 FROM 顺序逐张表连接，<b>每连接完一张表，就把只涉及已连接表的条件立刻用上</b>（谓词下推）。Course 打头时，Cname=「数据库」先把这张表砍到 1 行，后续每步连接的都是小结果；Student 打头时，第一步没有任何条件可用，只能先做 1000×5500 的完整笛卡尔积。课件优化树做的事一模一样：把 σ 尽量往下推，让中间结果从一开始就小。真实数据库的查询优化器还会配合索引，把 O(n×m) 降到接近 O(n+m)。'}
];

/* ================= 渲染 ================= */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderExercises(){
  const wrap=document.getElementById('exercises');
  wrap.innerHTML=EXERCISES.map((e,i)=>{
    if(e.discussion){
      return '<details class="ex" id="ex'+i+'"><summary>练习 '+(i+1)+' · '+e.t+'</summary>'+
        '<p class="q">'+e.q+'</p>'+
        '<div class="row"><button type="button" data-show="ans" data-i="'+i+'">看参考答案</button></div>'+
        '<div class="ansbox" style="white-space:pre-wrap">'+e.discussion+'</div></details>';
    }
    const pre = e.slowSql ? esc(e.slowSql) : 'SELECT ;';
    return '<details class="ex" id="ex'+i+'"><summary>练习 '+(i+1)+' · '+e.t+'</summary>'+
      '<p class="q">'+e.q+'</p>'+
      '<textarea id="exin'+i+'" spellcheck="false" aria-label="练习'+(i+1)+' SQL">'+pre+'</textarea>'+
      '<div class="row">'+
      '<button type="button" data-run="'+i+'">运行</button>'+
      '<button type="button" class="primary" data-check="'+i+'">检查</button>'+
      '<button type="button" data-show="hint" data-i="'+i+'">提示</button>'+
      '<button type="button" data-show="ans" data-i="'+i+'">看答案</button></div>'+
      '<div class="fb info" id="exfb'+i+'"></div>'+
      '<div class="out" id="exout'+i+'"></div>'+
      '<div class="hintbox">'+e.hint+'</div>'+
      '<div class="ansbox"><code>'+esc(e.ans).replace(/\n/g,'<br>')+'</code></div></details>';
  }).join('');
  wrap.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>runEx(+b.dataset.run));
  wrap.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>checkEx(+b.dataset.check));
  wrap.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{
    const box=b.closest('.ex').querySelector(b.dataset.show==='hint'?'.hintbox':'.ansbox');
    box.style.display=box.style.display==='block'?'none':'block';
  });
}
function miniMetrics(m){
  return '<div class="mini">'+
    '<span>扫描 <b>'+fmt(m.scanned)+'</b> 行</span>'+
    (m.joinKind!=='none'?'<span>连接比较 <b>'+fmt(m.joinComps)+'</b> 次</span>':'')+
    '<span>WHERE 判断 <b>'+fmt(m.whereEvals)+'</b> 次</span>'+
    '<span>输出 <b>'+fmt(m.rows.length)+'</b> 行</span>'+
    '<span>耗时 <b>'+m.ms.toFixed(2)+' ms</b></span></div>';
}
function runEx(i){
  const out=document.getElementById('exout'+i);
  try{
    const m=E.runSQL(document.getElementById('exin'+i).value);
    out.innerHTML=E.tableHTML(m,20,true)+miniMetrics(m);
  }catch(e){
    out.innerHTML='<div class="sqlerr">✗ '+e.message+'</div>';
  }
}
const key=r=>r.rows.map(x=>JSON.stringify(x)).sort().join('|');
function cmpTable(mine, ref, mineLabel, refLabel, speedMatters){
  const row=(label,m,cls)=>'<tr><td>'+label+'</td><td>'+fmt(m.rows.length)+' 行</td><td class="'+cls+'">'+fmt(m.joinComps)+' 次</td><td class="'+cls+'">'+m.ms.toFixed(2)+' ms</td></tr>';
  let clsMine='', clsRef='';
  if(speedMatters){
    if(mine.joinComps<ref.joinComps){ clsMine='better'; clsRef='worse'; }
    else if(mine.joinComps>ref.joinComps){ clsMine='worse'; clsRef='better'; }
  }
  return '<div class="cmp"><p class="muted" style="margin:10px 0 6px">判分对比（运行结果 + 运行速度）：</p>'+
    '<div class="tablewrap"><table class="rel"><thead><tr><th></th><th>结果</th><th>连接比较</th><th>耗时</th></tr></thead><tbody>'+
    row(mineLabel,mine,clsMine)+row(refLabel,ref,clsRef)+'</tbody></table></div></div>';
}
function checkEx(i){
  const fb=document.getElementById('exfb'+i);
  const card=document.getElementById('ex'+i);
  const out=document.getElementById('exout'+i);
  fb.className='fb info';
  try{
    const mine=E.runSQL(document.getElementById('exin'+i).value);
    out.innerHTML=E.tableHTML(mine,20,true)+miniMetrics(mine);
    const ex=EXERCISES[i];
    if(ex.slowSql){
      const base=E.runSQL(ex.slowSql);
      if(key(mine)!==key(base)){
        fb.innerHTML='✗ 结果和原查询不一致（你有 '+fmt(mine.rows.length)+' 行，原查询 '+fmt(base.rows.length)+' 行）。改写只能调整表顺序，不能改变查询含义。';
        fb.className='fb no'; card.classList.remove('pass');
        fb.insertAdjacentHTML('afterend', cmpTable(mine, base, '你的写法','原查询', true));
        return;
      }
      if(mine.joinComps<base.joinComps){
        fb.innerHTML='✓ 漂亮！结果一致，连接比较从 '+fmt(base.joinComps)+' 次降到 '+fmt(mine.joinComps)+' 次（约快 '+(base.joinComps/Math.max(1,mine.joinComps)).toFixed(1)+' 倍）。';
        fb.className='fb ok'; card.classList.add('pass');
      } else {
        fb.innerHTML='✗ 结果对了，但没变快：你的连接比较 '+fmt(mine.joinComps)+' 次 ≥ 原查询 '+fmt(base.joinComps)+' 次。提示：哪张表能最先被过滤到最小？';
        fb.className='fb no'; card.classList.remove('pass');
      }
      fb.insertAdjacentHTML('afterend', cmpTable(mine, base, '你的写法','原查询', true));
      return;
    }
    const ref=E.runSQL(ex.expect);
    if(key(mine)===key(ref)){
      const slower = mine.joinComps > ref.joinComps*1.5;
      fb.innerHTML='✓ 正确！结果与参考答案完全一致（'+fmt(ref.rows.length)+' 行）。'+(slower?'<br><span style="font-weight:600;color:var(--muted)">小提醒：结果对了，但你的写法连接比较 '+fmt(mine.joinComps)+' 次，参考只要 '+fmt(ref.joinComps)+' 次——做完第 8 题再回来体会。</span>':'');
      fb.className='fb ok'; card.classList.add('pass');
    } else {
      fb.innerHTML='✗ 结果不一致：你的 '+fmt(mine.rows.length)+' 行，参考答案 '+fmt(ref.rows.length)+' 行。看看是列选多了/少了，还是条件没写全？';
      fb.className='fb no'; card.classList.remove('pass');
    }
    fb.insertAdjacentHTML('afterend', cmpTable(mine, ref, '你的写法','参考答案', false));
  }catch(e){
    fb.textContent='✗ '+e.message;
    fb.className='fb no';
  }
}

document.getElementById('btnSmall').onclick=()=>setData('small');
document.getElementById('btnBig').onclick=()=>setData('big');
document.getElementById('btnShuffle').onclick=()=>setData('big');
['numStu','numCou'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{ if(mode==='big') setData('big'); }));
setData('small');
renderExercises();
</script>
