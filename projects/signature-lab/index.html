<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>数字签名实验室</title>
<style>
:root{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:22px;
  line-height:1.45;
  color:#102344;
  background:#f6f8fc;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --red:#b91c1c;
  --amber:#b45309;
  --green:#15803d;
  --teal:#0f766e;
  --line:#d6deea;
  --muted:#53647c;
  --card:#fff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button,select,summary{cursor:pointer}
button{min-height:44px;padding:8px 18px;border:1px solid #bac8da;border-radius:7px;background:#fff;font-weight:650;transition:background-color .15s,transform .15s}
button:hover:not(:disabled){background:#eff5ff;border-color:#6c96e8}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{cursor:not-allowed;background:#f0f3f7;color:#8c99ab;border-color:#e1e7f0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label.file-drop:focus-within{outline:3px solid #8eaff4;outline-offset:3px}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.primary:hover:not(:disabled){background:var(--blue-dark)}
h1,h2,h3,p{margin:0}
h1{font-size:43px;line-height:1.15;letter-spacing:-.03em;text-wrap:balance}
h2{font-size:26px;line-height:1.25}
h3{font-size:22px}
html{scrollbar-width:thin;scrollbar-color:#b9c8de #eef2f8}
html::-webkit-scrollbar{width:10px}
html::-webkit-scrollbar-track{background:#eef2f8}
html::-webkit-scrollbar-thumb{background:#b9c8de;border-radius:5px}
html::-webkit-scrollbar-thumb:hover{background:#8fa8cc}
.app{max-width:1440px;margin:auto;padding:30px 34px 40px}
.app-header{display:grid;gap:8px}
.eyebrow{color:var(--blue);font-size:19px;font-weight:750;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:23px}

/* Roles */
.actor-strip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;gap:14px;margin-top:22px}
.actor-card{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:12px 18px;background:#fff}
.actor-card.sender{border-color:#bcd0f4;background:#f2f7ff}
.actor-card.receiver{border-color:#a7d8d2;background:#f0fbf9}
.actor-role{font-size:19px;font-weight:750}
.actor-card.sender .actor-role{color:var(--blue-dark)}
.actor-card.receiver .actor-role{color:var(--teal)}
.actor-card strong{font-size:21px;font-weight:650}
.actor-card small{font-size:18px;color:var(--muted)}
.actor-link{display:grid;place-items:center;gap:2px;padding:0 8px;color:var(--muted);font-size:18px;text-align:center;white-space:nowrap}
.actor-link span{font-size:18px;border:1px dashed #b9c8de;border-radius:16px;padding:2px 10px;background:#fff}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:24px;scrollbar-width:thin;scrollbar-color:#b9c8de #eef2f8;overflow-x:auto}
.tabs button{flex:0 0 auto;border:0;border-radius:8px 8px 0 0;background:#edf1f7;padding:11px 17px;font-size:21px;transition:none;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:16px;padding:18px 0 16px}
.playback{display:flex;gap:10px}
.step-count{color:var(--muted);font-size:20px;margin-left:auto}
.step-dots{display:flex;gap:8px;align-items:center}
.step-dot{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;font-size:18px;font-weight:750;color:var(--muted);background:#eef2f8;border:1px solid var(--line)}
.step-dot[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.step-dots .step-dot[aria-current="true"]:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff}
.step-dot.done{background:#dbeafe;border-color:#a9c6f5;color:var(--blue-dark)}
.step-dot:disabled{opacity:.45;cursor:not-allowed}
.outcome{display:flex;align-items:center;min-height:92px;padding:16px 22px;border:1px solid #c7d7ef;border-radius:8px;background:#f0f6ff}
.outcome strong{display:block;font-size:28px}
.outcome p{font-size:22px;margin-top:4px}
.outcome.success{border-color:#a6d5c3;background:#effaf4;color:#116149}
.outcome.warning{border-color:#e6be66;background:#fff9eb;color:#854d0e}
.outcome.danger{border-color:#f1a5ab;background:#fff1f2;color:#991b1b}
.outcome.info{border-color:#c7d7ef;background:#f0f6ff;color:#17427a}

/* Shared layout */
.sig-stage{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,1fr);gap:24px;align-items:start}
.sig-wrap{display:grid;gap:20px;margin-top:20px}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:22px 24px;min-width:0}
.panel h2{margin-bottom:12px}
.panel .muted{font-size:19px}
.action-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.action-row .primary{padding-inline:24px}
.field-hint{font-size:18px;color:var(--muted)}
.input-error{font-size:19px;font-weight:650;color:var(--red);margin-top:10px}
.note{border-left:4px solid #e6be66;background:#fff9eb;padding:14px 18px;font-size:20px;line-height:1.65;color:#854d0e;border-radius:0 6px 6px 0;margin-top:16px}
.note strong{display:block;font-size:21px;margin-bottom:6px}
.note p+p{margin-top:8px}
.note.blue{border-color:#93b4e6;background:#f0f6ff;color:#17427a}
.note.green{border-color:#86c9a9;background:#f0fbf5;color:#116149}
.note.red{border-color:#f1a5ab;background:#fff1f2;color:#991b1b}
.formula-card{display:grid;gap:7px;border:1px solid #c7d7ef;border-radius:9px;background:#f0f6ff;padding:16px 20px;margin-bottom:14px}
.formula{font-family:var(--mono);font-size:25px;font-weight:700;color:#17427a;white-space:normal;overflow-wrap:anywhere}
.formula-sub{font-size:20px;color:var(--muted)}
.formula .hl{color:var(--blue);background:#dbeafe;border-radius:4px;padding:0 5px}
.formula .secret{color:var(--amber);background:#fff4d6;border-radius:4px;padding:0 5px}
.hex-value{font-family:var(--mono);font-size:19px;line-height:1.55;color:#17427a;background:#f6f8fc;border:1px solid #dfe6f1;border-radius:7px;padding:10px 13px;overflow-wrap:anywhere;word-break:break-all;max-height:230px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#b9c8de #eef2f8}
.hex-value .hex-dim{color:var(--muted)}
.mono{font-family:var(--mono)}
.small-note{font-size:18px;color:var(--muted);margin-top:8px}

/* Step 1 input */
.mode-switch{display:inline-flex;gap:4px;border:1px solid var(--line);border-radius:9px;background:#eef2f8;padding:4px;margin-bottom:16px}
.mode-switch button{min-height:40px;padding:5px 18px;border:0;border-radius:6px;background:transparent;font-size:20px;font-weight:650;color:var(--muted)}
.mode-switch button:hover:not(:disabled){background:#e3ebf7}
.mode-switch button[aria-pressed="true"]{background:#fff;color:var(--blue-dark);box-shadow:0 1px 2px rgba(16,35,68,.14)}
textarea.message-input{width:100%;min-height:150px;resize:vertical;padding:12px 15px;border:1px solid #bac8da;border-radius:8px;background:#fff;font-size:24px;line-height:1.5}
textarea.message-input:focus{border-color:var(--blue)}
.char-count{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:18px;color:var(--muted);margin-top:6px}
.char-count.over{color:var(--red);font-weight:700}
.file-icon svg{width:44px;height:44px;fill:none;stroke:#6c96e8;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.example-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.example-row span{font-size:18px;font-weight:650;color:var(--muted)}
.example-btn{min-height:38px;padding:4px 13px;border-radius:18px;font-size:19px;font-weight:600}
.file-drop{display:grid;justify-items:center;gap:6px;padding:26px 18px;border:2px dashed #b9c8de;border-radius:10px;background:#f8fafd;text-align:center;transition:border-color .15s,background-color .15s}
.file-drop:hover,.file-drop.dragover{border-color:var(--blue);background:#f0f6ff}
.file-drop input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.file-drop .file-icon{font-size:34px;line-height:1}
.file-drop strong{font-size:21px}
.file-drop small{font-size:18px;color:var(--muted)}
.file-chosen{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #b8dcc8;border-radius:8px;background:#f4fbf7;padding:10px 14px;margin-top:12px;font-size:19px}
.file-chosen strong{font-family:var(--mono);font-size:19px;color:#116149;overflow-wrap:anywhere}
.file-chosen button{min-height:36px;padding:3px 12px;font-size:18px;margin-left:auto}

.hash-panel{display:grid;gap:6px;border:1px solid #a9c6f5;border-radius:10px;background:#f7faff;padding:16px 18px}
.hash-label{font-size:19px;font-weight:750;color:var(--blue-dark);letter-spacing:.04em}
.hash-value{font-family:var(--mono);font-size:26px;font-weight:750;line-height:1.4;color:#17427a;letter-spacing:.02em}
.hash-group{display:inline-block;white-space:nowrap}
.hash-sub{font-size:19px;color:var(--muted)}
.empty-state{display:grid;gap:6px;place-items:center;min-height:180px;align-content:center;border:1px dashed #cfd9e7;border-radius:9px;background:#fbfcfe;color:var(--muted);text-align:center;padding:18px}
.empty-state strong{font-size:21px;color:#35506f}
.empty-state p{font-size:19px}
.compare-box{display:grid;gap:4px;border:1px solid #e6c27e;border-radius:9px;background:#fff9eb;padding:13px 16px;margin-top:12px}
.compare-box small{font-size:18px;color:var(--amber);font-weight:650}
.compare-box .hash-value{font-size:22px;color:#854d0e;font-weight:650}
details.info-box{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;margin-top:14px}
details.info-box summary{padding:11px 16px;font-weight:700;font-size:20px;background:#f6f8fc;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.info-box summary::-webkit-details-marker{display:none}
details.info-box summary:after{content:"+";font-size:24px;color:var(--muted)}
details.info-box[open] summary:after{content:"−"}
details.info-box .info-inner{padding:12px 16px 16px}
.math-steps{display:grid;gap:5px}
.math-line{font-family:var(--mono);font-size:21px;font-weight:650;color:#17427a;overflow-wrap:anywhere}
.math-intro{font-size:20px;line-height:1.6;color:#35506f;margin-bottom:8px}
.math-note{font-family:var(--mono);font-size:18px;color:var(--muted);line-height:1.6;margin-top:6px;overflow-wrap:anywhere}

/* Keys */
.key-cards{display:grid;gap:12px;margin-top:4px}
.key-card{border-radius:10px;padding:14px 16px;display:grid;gap:6px;border:2px solid}
.key-card.public{border-color:#b8dcc8;background:#f4fbf7;color:#116149}
.key-card.private{border-color:#e6c27e;background:#fff9eb;color:var(--amber)}
.key-card .key-head{display:flex;align-items:center;gap:8px;min-width:0}
.key-card small{font-size:18px;font-weight:700;letter-spacing:.04em}
.key-card .key-pair{font-family:var(--mono);font-size:20px;font-weight:700;overflow-wrap:anywhere;word-break:break-all}
.key-card .key-use{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:600;color:var(--muted)}
.key-card svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.key-owner{font-size:18px;font-weight:650;color:var(--muted);margin-top:10px}

/* Payload map */
.payload-map{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.payload-part{display:grid;gap:1px;border-radius:8px;padding:9px 13px;border:1px solid;min-width:0}
.payload-part b{font-size:19px;font-weight:750}
.payload-part small{font-size:17px;color:var(--muted);white-space:nowrap}
.payload-part.len{border-color:#bcd0f4;background:#f2f7ff}
.payload-part.msg{border-color:#a7d8d2;background:#f0fbf9}
.payload-part.sig{border-color:#e6c27e;background:#fff9eb}
.block-summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat-pill{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:20px;background:#f6f8fc;padding:4px 13px;font-size:18px;color:var(--muted)}
.stat-pill__label{white-space:nowrap}
.stat-pill b{font-family:var(--mono);font-size:20px;color:#17427a;white-space:nowrap}
.block-card{border:1px solid #f0b5ba;border-radius:9px;background:#fff7f7;padding:12px 15px;margin-top:12px}
.block-card .block-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.block-card .block-head b{font-size:19px;color:#991b1b}
.block-card .block-head span{font-size:17px;color:var(--muted);margin-left:auto}
.block-card .hex-value{background:#fff;border-color:#f3d2d5;color:#7f1d1d}
.block-card.sig-card{border-color:#e6c27e;background:#fffaf0}
.block-card.sig-card .block-head b{color:var(--amber)}
.block-card.sig-card .hex-value{background:#fff;border-color:#efd9a8;color:#854d0e}

/* Decrypted */
.msg-box{border:1px solid #a7d8d2;border-radius:9px;background:#f4fbfa;padding:13px 16px;margin-top:10px}
.msg-box small{display:block;font-size:18px;font-weight:700;color:var(--teal);margin-bottom:4px}
.msg-box pre{margin:0;font-family:var(--mono);font-size:21px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:190px;overflow:auto}
.sig-hex{font-family:var(--mono);font-size:17px;line-height:1.5;color:var(--amber);background:#fff9eb;border:1px solid #efd9a8;border-radius:7px;padding:9px 12px;overflow-wrap:anywhere;word-break:break-all;max-height:130px;overflow-y:auto}
.tamper-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tamper-row button{font-size:19px;min-height:40px;padding:5px 14px}
.tamper-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid #f1a5ab;border-radius:20px;background:#fff1f2;color:#991b1b;padding:3px 12px;font-size:18px;font-weight:700}

/* Verification */
.verify-card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:14px 16px;margin-top:12px}
.verify-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;align-items:start;padding:10px 0;border-bottom:1px solid #e6ebf3}
.verify-row:last-child{border-bottom:0;padding-bottom:0}
.verify-row:first-child{padding-top:0}
.verify-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:19px;font-weight:800;line-height:1;color:#fff;margin-top:2px}
.verify-mark.ok{background:var(--green)}
.verify-mark.bad{background:var(--red)}
.verify-mark.num{background:#dbeafe;color:var(--blue-dark)}
.verify-title{font-size:20px;font-weight:700}
.verify-detail{grid-column:2;display:grid;gap:3px;margin-top:2px}
.verify-detail .hash-value{font-size:20px;font-weight:650;letter-spacing:.02em}
.verify-detail small{font-size:18px;color:var(--muted)}
.verdict{display:grid;gap:4px;border:2px solid;border-radius:10px;padding:16px 18px;margin-top:14px}
.verdict strong{font-size:26px;line-height:1.2}
.verdict p{font-size:20px}
.verdict.ok{border-color:#86c9a9;background:#effaf4;color:#116149}
.verdict.bad{border-color:#f1a5ab;background:#fff1f2;color:#991b1b}
.verdict.neutral{border-color:#c7d7ef;background:#f0f6ff;color:#17427a}
.roundtrip-note{font-size:19px;color:var(--muted);margin-top:10px}
.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.chain span{font-size:18px;border:1px solid var(--line);border-radius:16px;background:#f6f8fc;padding:3px 11px}
.chain i{font-style:normal;color:var(--muted)}

.presets{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:19px;color:var(--muted)}
.footer .muted{font-size:19px}
.muted{color:var(--muted);font-size:19px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-width:1100px){
  .sig-stage{grid-template-columns:1fr}
  .actor-strip{grid-template-columns:1fr auto 1fr}
}
@media(max-width:820px){
  .actor-strip{grid-template-columns:1fr;gap:8px}
  .actor-link{grid-auto-flow:column;justify-content:start;padding:0 4px}
  .actor-link::before{content:""}
}
@media(max-width:760px){
  .app{padding:20px 14px 28px}
  h1{font-size:33px}
  .subtitle{font-size:21px}
  .actor-card{padding:10px 14px}
  .actor-card strong{font-size:20px}
  .actor-link span{font-size:17px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;border-bottom:0;overflow:visible}
  .tabs button{flex:1 1 calc(50% - 6px);border-radius:8px;padding:9px 6px;font-size:18px;white-space:nowrap;min-width:0}
  .toolbar{gap:10px;padding:14px 0 12px}
  .step-count{margin-left:auto}
  .step-dots{gap:6px}
  .step-dot{width:30px;height:30px}
  .outcome{min-height:0;padding:14px 16px}
  .outcome strong{font-size:24px}
  .outcome p{font-size:20px}
  .sig-wrap{gap:14px;margin-top:14px}
  .sig-stage{gap:14px}
  .panel{padding:16px}
  .panel h2{margin-bottom:10px}
  .note{margin-top:12px;padding:12px 14px;font-size:19px;line-height:1.6}
  .note strong{font-size:20px}
  textarea.message-input{font-size:22px;min-height:130px}
  .hash-value{font-size:24px}
  .compare-box .hash-value{font-size:20px}
  .math-line{font-size:19px}
  .math-intro{font-size:19px}
  .math-note{font-size:17px}
  .hex-value{font-size:17px}
  .key-card .key-pair{font-size:18px}
  .payload-map{gap:6px}
  .payload-part{flex:1 1 100%;grid-template-columns:auto 1fr;align-items:baseline;gap:8px}
  .payload-part small{margin-left:auto}
  .verify-row{grid-template-columns:30px minmax(0,1fr)}
  .verify-detail .hash-value{font-size:18px}
  .verdict strong{font-size:23px}
  .tamper-row button{flex:1 1 100%}
  .footer{flex-direction:column;gap:6px;margin-top:24px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<main class="app">
  <header class="app-header">
    <p class="eyebrow">计算机科学导论 · 信息安全</p>
    <h1>数字签名实验室</h1>
    <p class="subtitle">先算 MD5 散列，再用发送者私钥签名；整包用接收者公钥加密，接收者解密后重算散列、验签。</p>
  </header>

  <div class="actor-strip" aria-label="实验角色">
    <div class="actor-card sender">
      <span class="actor-role">发送者 Alice</span>
      <strong>持有自己的私钥</strong>
      <small>算散列 · 私钥签名</small>
    </div>
    <div class="actor-link" aria-hidden="true"><span>公钥加密的整包</span>→</div>
    <div class="actor-card receiver">
      <span class="actor-role">接收者 Bob</span>
      <strong>持有自己的私钥</strong>
      <small>私钥解密 · 公钥验签</small>
    </div>
  </div>

  <nav class="tabs" aria-label="实验步骤">
    <button id="tab-step-0" role="tab" aria-selected="true" data-step="0">① 输入与散列</button>
    <button id="tab-step-1" role="tab" aria-selected="false" data-step="1">② 私钥签名</button>
    <button id="tab-step-2" role="tab" aria-selected="false" data-step="2">③ 公钥加密</button>
    <button id="tab-step-3" role="tab" aria-selected="false" data-step="3">④ 私钥解密</button>
    <button id="tab-step-4" role="tab" aria-selected="false" data-step="4">⑤ 验签</button>
  </nav>

      const input = el('textarea', 'message-input');
      input.id = 'messageText';
      input.placeholder = '在这里写一条要发给 Bob 的消息';
      input.value = state.text;
      input.setAttribute('aria-label', '要签名的消息');
      input.addEventListener('input', () => {
        state.text = input.value;
        if (state.hash) {
          const caret = input.selectionStart;
          clearDerived();
          render();
          const next = $('messageText');
          if (next) {
            next.focus();
            const pos = Math.min(caret, next.value.length);
            next.setSelectionRange(pos, pos);
          }
          return;
        }
        update();
      });
      wrap.append(input);
      const count = el('div', 'char-count');
      const left = el('span', '', '');
      const right = el('span', '', `上限 ${MAX_BYTES} 字节`);
      count.append(left, right);
      wrap.append(count);
      const update = () => {
        const bytes = S.utf8(state.text).length;
        left.textContent = `${bytes} 字节 · ${state.text.length} 个字符`;
        left.classList.toggle('over', bytes > MAX_BYTES);
      };
      update();

      const examples = el('div', 'example-row');
      examples.append(el('span', '', '示例'));
      EXAMPLES.forEach(text => {
        const button = el('button', 'example-btn', text.replace(/，.*$/, '…'));
        button.type = 'button';
        button.addEventListener('click', () => {
          state.text = text;
          state.mode = 'text';
          clearDerived();
          render();
        });
        examples.append(button);
      });
      wrap.append(examples);
    } else {
      if (state.file) {
        const chosen = el('div', 'file-chosen');
        chosen.append(el('strong', '', state.file.name), el('span', '', `${state.file.size} 字节`));
        const remove = el('button', '', '换一个');
        remove.type = 'button';
        remove.addEventListener('click', () => {
          state.file = null;
          clearDerived();
          render();
        });
        chosen.append(remove);
        wrap.append(chosen);
      } else {
        const label = el('label', 'file-drop');
        const input = el('input');
        input.type = 'file';
        input.addEventListener('change', () => pickFile(input.files[0]));
        const iconBox = el('span', 'file-icon');
        iconBox.innerHTML = icon('file');
        label.append(input, iconBox, el('strong', '', '选择文件，或把文件拖到这里'), el('small', '', `任意类型，最大 ${MAX_BYTES} 字节；文件不会上传`));
        label.addEventListener('dragover', event => {
          event.preventDefault();
          label.classList.add('dragover');
        });
        label.addEventListener('dragleave', () => label.classList.remove('dragover'));
        label.addEventListener('drop', event => {
          event.preventDefault();
          label.classList.remove('dragover');
          pickFile(event.dataTransfer.files[0]);
        });
        wrap.append(label);
      }
    }
    return wrap;
  }

  function md5Details(length) {
    const padded = md5BlockCount(length) * 64;
    return detailsBox('MD5 内部做了什么？', inner => {
      inner.append(el('p', 'math-intro', 'MD5 不是加密，它把任意长度的消息压成固定的 128 位。计算过程：'));
      const steps = el('div', 'math-steps');
      [
        `① 消息按 UTF-8 变成 ${length} 个字节`,
        `② 末尾补 1 个 0x80，再补 0x00 直到 ${padded - 8} 字节`,
        `③ 末尾写 64 位原始长度 ${length * 8}，凑满 ${padded} 字节`,
        `④ 切成 ${md5BlockCount(length)} 个 64 字节分组，每组做 4 轮、64 次位运算`,
        '⑤ 最后得到 4 个 32 位寄存器：4 × 32 = 128 位'
      ].forEach(text => steps.append(el('div', 'math-line', text)));
      inner.append(steps);
      inner.append(el('p', 'math-note', '输出 16 字节，写成十六进制就是 32 个字符。任何一步改动，最后的 128 位都会变。'));
    });
  }

  function avalanche() {
    const bytes = state.message || new Uint8Array(0);
    let altered;
    if (bytes.length === 0) {
      altered = S.utf8('a');
    } else {
      altered = bytes.slice();
      altered[altered.length - 1] ^= 0x01;
    }
    const altHash = S.md5Bytes(altered);
    const a = S.toHex(state.hash);
    const b = S.toHex(altHash);
    let diff = 0;
    for (let i = 0; i < 32; i += 1) if (a[i] !== b[i]) diff += 1;
    return {altHash, diff};
  }

  function renderStepInput() {
    const wrap = el('div', 'sig-wrap');
    const stage = el('div', 'sig-stage');

    const left = panel('① 输入消息，计算 MD5');
    const modes = el('div', 'mode-switch');
    [['text', '文字'], ['file', '文件']].forEach(([mode, label]) => {
      const button = el('button', '', label);
      button.type = 'button';
      button.setAttribute('aria-pressed', String(state.mode === mode));
      button.addEventListener('click', () => setMode(mode));
      modes.append(button);
    });
    left.append(modes);
    left.append(renderInputMode());

    const actions = el('div', 'action-row');
    const compute = el('button', 'primary', state.hash ? '重新计算散列' : '计算 MD5 散列');
    compute.type = 'button';
    compute.addEventListener('click', computeHash);
    actions.append(compute);
    actions.append(el('span', 'field-hint', '散列只读消息，不会修改它。'));
    left.append(actions);
    if (state.error) left.append(el('p', 'input-error', state.error));

    const right = panel('散列结果');
    if (!state.hash) {
      right.append(emptyState('还没有散列', '写好消息或选好文件，点“计算 MD5 散列”。'));
      right.append(noteBox('散列不是加密', '散列是单向的：从 128 位结果无法还原消息；它也没有钥匙，任何人都能算。加密是可逆的，需要钥匙。', 'blue'));
    } else {
      const card = el('div', 'hash-panel');
      card.append(el('span', 'hash-label', state.mode === 'file' && state.file ? `文件的 MD5 · ${state.file.name}` : '消息的 MD5'));
      card.append(hashNode(S.toHex(state.hash)));
      card.append(el('p', 'hash-sub', `${state.message.length} 字节 → ${md5BlockCount(state.message.length)} 个 64 字节分组 → 128 位（32 个十六进制字符）`));
      const compareBtn = el('button', '', state.compare ? '收起对比' : '改一个字节再算一次');
      compareBtn.type = 'button';
      compareBtn.style.cssText = 'justify-self:start;min-height:38px;padding:4px 14px;font-size:18px;margin-top:4px';
      compareBtn.addEventListener('click', () => {
        state.compare = !state.compare;
        render();
      });
      card.append(compareBtn);
      right.append(card);

      if (state.compare) {
        const {altHash, diff} = avalanche();
        const box = el('div', 'compare-box');
        box.append(el('small', '', '把消息改掉一个字节后'));
        box.append(hashNode(S.toHex(altHash)));
        box.append(el('p', 'hash-sub', `32 个十六进制字符里有 ${diff} 个不同。`));
        right.append(box);
      }

      right.append(md5Details(state.message.length));
      right.append(noteBox('雪崩效应', '消息只改一个字节，散列就面目全非。所以散列能灵敏地发现内容变化，却无法从散列反推内容。', 'blue'));
      right.append(noteBox('MD5 已经不安全', '2004 年王小云团队给出了 MD5 碰撞方法：不同内容可以算出相同散列。真实系统请用 SHA-256；这里用 MD5 只是结果短、好读。'));
    }

    stage.append(left, right);
    wrap.append(stage);
    return wrap;
  }

  /* ---------- step 2 ---------- */

  function renderStepSign() {
    const wrap = el('div', 'sig-wrap');
    const stage = el('div', 'sig-stage');

    const left = panel('② 发送者用私钥签名');
    const hashCard = el('div', 'hash-panel');
    hashCard.append(el('span', 'hash-label', '待签名的散列 H'));
    hashCard.append(hashNode(S.toHex(state.hash)));
    hashCard.append(el('p', 'hash-sub', '16 字节，来自上一步；签名只针对这 128 位。'));
    left.append(hashCard);

    const card = el('div', 'formula-card');
    card.append(formula([
      {text: 's', cls: 'hl'}, ' = ', {text: 'H', cls: 'hl'}, ' ^ ',
      {text: 'D_A', cls: 'secret'}, ' mod ', {text: 'N_A', cls: 'hl'}
    ]));
    card.append(el('p', 'formula-sub', 'D_A 是 Alice 的私钥指数，N_A 是 Alice 公钥里的模数。H 只有 16 字节，一定小于 64 字节的 N_A。'));
    left.append(card);

    if (state.signature) {
      const sigCard = el('div', 'block-card sig-card');
      const head = el('div', 'block-head');
      head.append(el('b', '', '签名 s'), el('span', '', '128 个十六进制字符 = 64 字节'));
      sigCard.append(head);
      sigCard.append(el('div', 'hex-value', S.toHex(state.signature)));
      left.append(sigCard);
    } else {
      left.append(emptyState('还没有签名', '点下面的按钮，用 Alice 的私钥对散列做一次模幂运算。'));
    }

    const actions = el('div', 'action-row');
    const signBtn = el('button', 'primary', state.signature ? '重新签名' : '用发送者私钥签名');
    signBtn.type = 'button';
    signBtn.addEventListener('click', doSign);
    actions.append(signBtn);
    left.append(actions);
    if (state.error) left.append(el('p', 'input-error', state.error));

    const right = panel('用哪把钥匙？');
    right.append(el('p', 'key-owner', '发送者 Alice'));
    const cards = el('div', 'key-cards');
    cards.append(
      keyCard('public', 'Alice 公钥', '任何人用它验签', [['E_A', '65537'], ['N_A', shortBi(S.SENDER.n)]]),
      keyCard('private', 'Alice 私钥', '只有 Alice 用它签名', [['D_A', shortBi(S.SENDER.d)], ['N_A', shortBi(S.SENDER.n)]])
    );
    right.append(cards);
    right.append(noteBox('签名不是加密', '私钥“加密”后，任何人都能用公钥解开并恢复散列——这正是验签要的效果。它不隐藏消息，只证明“这份散列是 Alice 认可的”。', 'blue'));
    right.append(noteBox('为什么先算散列？', '消息可长可短，RSA 一次只能处理小于 N 的数。散列把任意长度压成 16 字节，签名长度就固定为 64 字节。真实系统还会加上 PSS 填充和证书。', 'green'));
    right.append(keyDetails());
    stage.append(left, right);
    wrap.append(stage);
    return wrap;
  }

  /* ---------- step 3 ---------- */

  function payloadMap(messageLength) {
    const map = el('div', 'payload-map');
    const part = (cls, size, label) => {
      const node = el('div', 'payload-part ' + cls);
      node.append(el('b', '', size), el('small', '', label));
      return node;
    };
    map.append(
      part('len', '4 字节', '消息长度'),
      part('msg', `${messageLength} 字节`, '消息本体'),
      part('sig', '64 字节', 'Alice 签名')
    );
    return map;
  }

  function allBlocksDetails(blocks) {
    return detailsBox(`查看密文块（共 ${blocks.length} 个）`, inner => {
      inner.append(el('p', 'math-intro', `每个明文块 63 字节，加密后都是 64 字节（128 个十六进制字符）。下面显示前 ${Math.min(6, blocks.length)} 块。`));
      blocks.slice(0, 6).forEach((block, index) => {
        inner.append(el('p', 'key-owner', `密文块 ${index + 1}`));
        inner.append(el('div', 'hex-value', block));
      });
      if (blocks.length > 6) inner.append(el('p', 'math-note', `其余 ${blocks.length - 6} 块按同样方法逐块加密。`));
    });
  }

  function renderStepEncrypt() {
    const wrap = el('div', 'sig-wrap');
    const stage = el('div', 'sig-stage');

    const left = panel('③ 接收者用公钥加密整包');
    left.append(el('p', 'muted', '签名只保护散列，消息本身还是明文。把消息和签名拼成一个包，再用 Bob 的公钥加密，路上就只有密文。'));
    left.append(el('p', 'key-owner', '整包结构'));
    left.append(payloadMap(state.message.length));

    const total = 4 + state.message.length + S.KEY_BYTES;
    const count = Math.ceil(total / S.BLOCK_BYTES);
    const stats = el('div', 'block-summary');
    [
      ['整包', `${total} 字节`],
      ['分块', `${count} 块`],
      ['块大小', '明文 63 字节 → 密文 64 字节']
    ].forEach(([label, value]) => {
      const pill = el('span', 'stat-pill');
      pill.append(el('span', 'stat-pill__label', label), el('b', '', value));
      stats.append(pill);
    });
    left.append(stats);

    const card = el('div', 'formula-card');
    card.append(formula([
      {text: 'c_i', cls: 'hl'}, ' = ', {text: 'm_i', cls: 'hl'}, ' ^ ',
      {text: 'E_B', cls: 'hl'}, ' mod ', {text: 'N_B', cls: 'hl'}
    ]));
    card.append(el('p', 'formula-sub', 'm_i 是第 i 个 63 字节明文块；E_B 和 N_B 来自 Bob 的公钥。'));
    left.append(card);

    if (state.blocks) {
      const head = el('div', 'block-card');
      const headRow = el('div', 'block-head');
      headRow.append(el('b', '', '第一块：明文 → 密文'), el('span', '', '后面每块同理'));
      head.append(headRow);
      head.append(el('p', 'small-note', '明文块 m₁（63 字节，十六进制；不足部分补 0x00）'));
      head.append(el('div', 'hex-value', S.toHex(state.payload.slice(0, S.BLOCK_BYTES))));
      head.append(el('p', 'small-note', '密文块 c₁（64 字节，十六进制）'));
      head.append(el('div', 'hex-value', state.blocks[0]));
      left.append(head);
      left.append(allBlocksDetails(state.blocks));
    } else {
      left.append(emptyState('还没有密文', '点下面的按钮，把整包逐块加密。'));
    }

    const actions = el('div', 'action-row');
    const encryptBtn = el('button', 'primary', state.blocks ? '重新加密' : '用接收者公钥加密');
    encryptBtn.type = 'button';
    encryptBtn.addEventListener('click', doEncrypt);
    actions.append(encryptBtn);
    left.append(actions);
    if (state.error) left.append(el('p', 'input-error', state.error));

    const right = panel('为什么整包一起加密？');
    right.append(el('p', 'key-owner', '接收者 Bob'));
    const cards = el('div', 'key-cards');
    cards.append(
      keyCard('public', 'Bob 公钥', '任何人用它加密', [['E_B', '65537'], ['N_B', shortBi(S.RECEIVER.n)]]),
      keyCard('private', 'Bob 私钥', '只有 Bob 用它解密', [['D_B', shortBi(S.RECEIVER.d)], ['N_B', shortBi(S.RECEIVER.n)]])
    );
    right.append(cards);
    right.append(noteBox('只加密消息不够', '签名也必须一起加密。否则攻击者能看到签名、替换消息，再声称那是 Alice 发的。整包加密后，接收方才能同时拿到可信的消息和签名。', 'blue'));
    right.append(noteBox('真实系统用混合加密', 'RSA 每次只能装下小于 N 的数据，长文件要切成很多块，很慢。真实系统会随机生成一把对称密钥，用 RSA 只加密这把密钥，再用它加密文件。', 'green'));
    stage.append(left, right);
    wrap.append(stage);
    return wrap;
  }

  /* ---------- step 4 ---------- */

  function messageBox(bytes, label) {
    const box = el('div', 'msg-box');
    box.append(el('small', '', label));
    const shown = describeBytes(bytes);
    const pre = el('pre', '', bytes.length === 0 ? '（空消息）' : shown.text);
    box.append(pre);
    if (shown.kind === 'hex') box.append(el('p', 'small-note', '这段内容不是合法 UTF-8 文本，按十六进制显示前 64 字节。'));
    return box;
  }

  function renderStepDecrypt() {
    const wrap = el('div', 'sig-wrap');
    const stage = el('div', 'sig-stage');

    const left = panel('④ 接收者用私钥解密');

    ]));

      sigBox.append(el('div', 'hex-value', S.toHex(state.received.signature)));
      left.append(sigBox);

      const stats = el('div', 'block-summary');
      [
        ['消息', `${state.received.message.length} 字节`],
        ['签名', '64 字节'],
        ['整包', `${4 + state.received.message.length + 64} 字节`]
      ].forEach(([label, value]) => {
        const pill = el('span', 'stat-pill', label + ' ');
        pill.append(el('b', '', value));

      });
      left.append(stats);

      if (state.tamper) {
        const badge = el('div', 'tamper-row');

      const tamperSig = el('button', '', '篡改签名中的一个字节');
      tamperSig.type = 'button';
      tamperSig.addEventListener('click', () => applyTamper('signature'));
      tamperActions.append(tamperMsg, tamperSig);
      if (state.tamper) {
        const restore = el('button', '', '恢复原样');
        restore.type = 'button';
        restore.addEventListener('click', restoreTamper);
        tamperActions.append(restore);
      }
      left.append(tamperActions);
    } else {
      left.append(emptyState('还没有解密', '点下面的按钮，用 Bob 的私钥把整包还原。'));
    }

    const actions = el('div', 'action-row');
    const decryptBtn = el('button', 'primary', state.received ? '重新解密' : '用接收者私钥解密');
    decryptBtn.type = 'button';
    decryptBtn.addEventListener('click', doDecrypt);
    actions.append(decryptBtn);
    left.append(actions);
    if (state.error) left.append(el('p', 'input-error', state.error));

    const right = panel('Bob 手里的钥匙');
    const cards = el('div', 'key-cards');
    cards.append(
      keyCard('private', 'Bob 私钥', '解密整包', [['D_B', shortBi(S.RECEIVER.d)], ['N_B', shortBi(S.RECEIVER.n)]]),
      keyCard('public', 'Bob 公钥', '可公开，别人用它加密', [['E_B', '65537'], ['N_B', shortBi(S.RECEIVER.n)]])
    );
    right.append(cards);
    right.append(noteBox('解密不等于验签', '能解开只说明“Bob 收到了”，不能说明“Alice 发的”。任何人都能用 Bob 的公钥加密一条假消息；只有下一步用 Alice 的公钥验签，才能确认来源。', 'blue'));
    right.append(noteBox('关于这里的“篡改”', '按钮改的是 Bob 解密后的内容，方便单独观察验签。若攻击者直接改密文，解密本身就会得到乱码；能改到明文，说明中间环节已经失守，验签是最后一道完整性检查。'));
    stage.append(left, right);
    wrap.append(stage);
    return wrap;
  }

  /* ---------- step 5 ---------- */

  function verifyRows() {
    const rows = el('div', 'verify-card');
    const addRow = (mark, markCls, title, value, detail) => {
      const row = el('div', 'verify-row');
      const badge = el('span', 'verify-mark ' + markCls, mark);
      row.append(badge);
      const body = el('div', '');
      body.append(el('div', 'verify-title', title));
      const detailBox = el('div', 'verify-detail');
      if (value) detailBox.append(hashNode(value));
      if (detail) detailBox.append(el('small', '', detail));
      body.append(detailBox);
      row.append(body);
      rows.append(row);
    };

    addRow('1', 'num', "重算散列 H′ = MD5(收到的消息)", S.toHex(state.verify.hash), `${state.received.message.length} 字节`);
    addRow('2', 'num', '从签名恢复 H_sig = s^E_A mod N_A', S.toHex(state.verify.recovered), '使用 Alice 的公钥');
    addRow(
      state.verify.match ? '✓' : '✗',
      state.verify.match ? 'ok' : 'bad',
      '比较 H′ 与 H_sig',
      '',
      state.verify.match ? '32 个十六进制字符完全一致。' : '两个散列不一致，签名对不上这份消息。'
    );
    return rows;
  }

  function verdict() {
    const node = el('div', 'verdict ' + (state.verify.match ? 'ok' : 'bad'));
    if (state.verify.match) {
      node.append(el('strong', '', '验签通过：消息完整，签名来自 Alice'));
      node.append(el('p', '', '重算的散列与签名里恢复出的散列完全相同。改动一个字节、或换一份签名，都会让这两个值对不上。'));
    } else {
      node.append(el('strong', '', '验签失败：内容或签名被改过'));
      if (state.tamper === 'message') {
        node.append(el('p', '', '消息被改过，重算的 H′ 已经变了；签名里保存的仍是原消息的 H_sig，所以两者不同。'));
      } else if (state.tamper === 'signature') {
        node.append(el('p', '', '签名被改过，用 Alice 公钥恢复出的 H_sig 变成乱码，与 H′ 不同。'));
      } else {
        node.append(el('p', '', 'H′ 与 H_sig 不一致，说明收到的内容不能通过 Alice 的签名验证。'));
      }
    }
    return node;
  }

  function renderStepVerify() {
    const wrap = el('div', 'sig-wrap');
    const stage = el('div', 'sig-stage');

    const left = panel('⑤ 重算散列，用 Alice 公钥验签');
    left.append(el('p', 'muted', 'Bob 不需要原始消息，也不需要用 Alice 的私钥。他只需要收到的消息、签名，以及 Alice 的公钥。'));

    left.append(messageBox(state.received.message, '收到的消息'));

    const chain = el('div', 'chain');
    ['收到的消息', 'MD5', 'H′', '与', 's^E_A mod N_A', '比较'].forEach((text, index) => {
      if (index === 3) { chain.append(el('i', '', text)); return; }
      chain.append(el('span', '', text));
      if (index < 5 && index !== 2 && index !== 3) chain.append(el('i', '', '→'));
    });
    left.append(chain);

    if (state.verify) {
      left.append(verifyRows());
      left.append(verdict());
    } else {
      left.append(emptyState('还没有验签', '点下面的按钮：重算散列，再从签名里恢复散列，最后比较两个值。'));
      if (state.tamper) left.append(noteBox('先别恢复', '当前内容被改过。直接验签，看看接收者能不能发现。', 'red'));
    }

    const actions = el('div', 'action-row');
    const verifyBtn = el('button', 'primary', state.verify ? '再验一次' : '重新计算并验签');
    verifyBtn.type = 'button';
    verifyBtn.addEventListener('click', doVerify);
    actions.append(verifyBtn);
    if (state.tamper) {
      const back = el('button', '', '回到篡改／恢复');
      back.type = 'button';
      back.addEventListener('click', () => goStep(3));
      actions.append(back);
    }
    left.append(actions);
    if (state.error) left.append(el('p', 'input-error', state.error));

    const right = panel('三项保护，各用各的钥匙');
    right.append(el('p', 'key-owner', 'Alice 公钥'));
    const cards = el('div', 'key-cards');
    cards.append(keyCard('public', 'Alice 公钥', '验签', [['E_A', '65537'], ['N_A', shortBi(S.SENDER.n)]]));
    right.append(cards);
    right.append(noteBox('散列 ≠ 签名', '散列谁都能算：攻击者改了消息，也能算出新的散列。单靠散列不能防伪造。是 Alice 用私钥对散列签名，才把“内容”和“身份”绑在一起。', 'blue'));
    right.append(noteBox('验签只需要公开信息', '收到的消息 + 签名 + Alice 公钥。Alice 的私钥始终不离开她手里；Bob 也不需要提前保存一份原文。', 'green'));

    const protect = el('div', 'verify-card');
    [
      ['完整性', 'MD5 散列：内容改一个字节，散列就变'],
      ['身份', 'Alice 私钥签名：只有 Alice 能生成'],
      ['机密性', 'Bob 公钥加密：只有 Bob 能解开']
    ].forEach(([title, text], index) => {
      const row = el('div', 'verify-row');
      row.append(el('span', 'verify-mark num', String(index + 1)));
      const body = el('div', '');
      body.append(el('div', 'verify-title', title));
      body.append(el('div', 'verify-detail', text));
      row.append(body);
      protect.append(row);
    });
    right.append(protect);
    stage.append(left, right);
    wrap.append(stage);
    return wrap;
  }

  /* ---------- outcome & toolbar ---------- */

  function setOutcome(style, title, text) {
    $('outcome').className = 'outcome ' + style;
    $('outcomeTitle').textContent = title;
    $('outcomeText').textContent = text;
  }

  function renderOutcome() {
    if (state.error) {
      setOutcome('danger', '这一步没有完成', state.error);
      return;
    }
    if (state.step === 0) {
      if (state.hash) {
        setOutcome('success', '散列算好了', `${state.message.length} 字节的消息得到 ${S.toHex(state.hash).slice(0, 8)}…，固定 128 位。下一步用 Alice 的私钥给它签名。`);
      } else {
        setOutcome('info', '先输入消息', '写一段文字或选一个小文件，然后计算 MD5 散列。');
      }
      return;
    }
    if (state.step === 1) {
      if (state.signature) {
        setOutcome('success', '签名已生成', `Alice 用私钥对散列做了模幂运算，得到 64 字节签名。消息本身还是明文。`);
      } else {
        setOutcome('info', '给散列签名', '签名不是加密消息，而是用 Alice 的私钥处理这 128 位散列。');
      }
      return;
    }
    if (state.step === 2) {
      if (state.blocks) {
        setOutcome('success', '整包已加密', `消息和签名被打成 ${state.payload.length} 字节的包，切成 ${state.blocks.length} 块，每块加密成 64 字节密文。`);
      } else {
        setOutcome('info', '把整包加密', '用 Bob 的公钥逐块加密“消息 + 签名”，公开信道里只剩密文。');
      }
      return;
    }
    if (state.step === 3) {
      if (state.tamper) {
        setOutcome('warning', '内容被改过', `${state.tamperInfo}。先别恢复，去第 5 步验签，看能不能发现。`);
      } else if (state.received) {
        setOutcome('success', 'Bob 解开了整包', `恢复出 ${state.received.message.length} 字节消息和 64 字节签名。解密成功还不等于来源可信。`);
      } else {
        setOutcome('info', '用 Bob 私钥解密', '只有 Bob 的私钥能把每块密文还原成明文，再按长度头拆出消息和签名。');
      }
      return;
    }
    if (state.verify) {
      if (state.verify.match) {
        setOutcome('success', '验签通过', 'H′ 与 H_sig 完全一致：消息没有被改，签名确实由 Alice 的私钥生成。');
      } else {
        setOutcome('danger', '验签失败', '重算的散列与签名里恢复出的散列不一致，这份内容不能当作 Alice 的消息。');
      }
      return;
    }
    setOutcome('info', '重算并验签', '用收到的消息算 H′，用 Alice 的公钥从签名恢复 H_sig，再比较这两个值。');
  }

  function renderToolbar() {
    $('prevBtn').disabled = state.step <= 0;
    $('nextBtn').disabled = state.step >= 4 || state.step >= maxStep();
    $('stepCount').textContent = `第 ${state.step + 1} / 5 步`;
    const dots = $('stepDots');
    dots.replaceChildren();
    for (let i = 0; i < 5; i += 1) {
      const dot = el('button', 'step-dot' + (i < state.step ? ' done' : ''), String(i + 1));
      dot.type = 'button';
      dot.disabled = i > maxStep();
      if (i === state.step) dot.setAttribute('aria-current', 'true');
      dot.setAttribute('aria-label', `第 ${i + 1} 步`);
      dot.addEventListener('click', () => goStep(i));
      dots.append(dot);
    }
  }

  function render() {
    if (state.step > maxStep()) state.step = maxStep();
    document.querySelectorAll('[data-step]').forEach(button => {
      const index = Number(button.dataset.step);
      button.setAttribute('aria-selected', String(index === state.step));
      button.disabled = index > maxStep();
    });
    $('stage').setAttribute('aria-labelledby', 'tab-step-' + state.step);
    renderToolbar();
    renderOutcome();
    const root = $('sceneRoot');
    root.replaceChildren();
    if (state.step === 0) root.append(renderStepInput());
    else if (state.step === 1) root.append(renderStepSign());
    else if (state.step === 2) root.append(renderStepEncrypt());
    else if (state.step === 3) root.append(renderStepDecrypt());
    else root.append(renderStepVerify());
  }

  /* ---------- events ---------- */

  document.querySelectorAll('[data-step]').forEach(button => {
    button.addEventListener('click', () => goStep(Number(button.dataset.step)));
  });

  $('nextBtn').addEventListener('click', () => goStep(state.step + 1));
  $('prevBtn').addEventListener('click', () => goStep(state.step - 1));
  $('resetBtn').addEventListener('click', () => {
    state.mode = 'text';
    state.text = EXAMPLES[0];
    state.file = null;
    clearDerived();
    render();
  });

  document.addEventListener('keydown', event => {
    if (event.target.closest('input, textarea, select, button, summary')) return;
    if (event.key === 'ArrowRight') {
      event.preventDefault();
      goStep(state.step + 1);
    } else if (event.key === 'ArrowLeft') {
      event.preventDefault();
      goStep(state.step - 1);
    }
  });

  render();
})();

</script>
</body>
</html>
