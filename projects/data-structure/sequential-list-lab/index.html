function build(o,i,v){let a=[...data],f=[],n=a.length;if(o==='init')return[frame(base,[],[],[],'表初始化',null,base.length,'',base.length)];if(o==='length')return[frame(a,[],[],[],'读取 n = '+n,null,n,'',n)];if(o==='append'){if(baseIndex+n>=MAX)return[frame(a,[],[],[],'容量已满',n,n,'',n)];f.push(frame(a,[],[n],[n],'i 指向 n',n,n,'写入位置',n));a.push(v);f.push(frame(a,[],[n],[],'写入新元素',n,n+1,'新元素',n+1));return f}if(o==='pop'){if(!n)return[frame(a)];let old=a.pop();f.push(frame([...a,old],[],[n-1],[n-1],'i 指向最后元素',n-1,n,'最后一个',n));f.push(frame(a,[],[],[],'n - 1',null,n-1,'',n-1));return f}if(o==='access'){if(i<0||i>=n)return[frame(a,[],[],[],'下标越界',i,n,'越界',n)];f.push(frame(a,[],[i],[i],'i 跳到目标位置',i,n,'读取 A['+i+']',n));a[i]=v;f.push(frame(a,[],[i],[],'更新值',i,n,'更新后',n));return f}if(o==='search'){let z=String(v),found=-1;for(let j=0;j<n;j++){f.push(frame(a,[],[j],[],'比较 A['+j+'] = '+a[j],j,n,'检查 '+a[j],n));if(String(a[j])===z){found=j;break}}f.push(frame(a,[],found<0?[]:[found],[],found<0?'未找到 '+z:'找到：下标 '+found,found<0?null:found,n,found<0?'结束':'命中',n));return f}if(o==='insert-before'||o==='insert-after'){let p=o==='insert-before'?i:i+1;if(p<0||p>n||baseIndex+n>=MAX)return[frame(a,[],[],[],'位置或容量不可用',p,n,'不可用',n)];f.push(frame(a,[],[],[p],'i 指向插入位置',p,n,'插入位置',n));for(let j=n-1;j>=p;j--){let next=[...a];next[j+1]=next[j];f.push(frame(next,[j],[j+1],[],'A['+j+'] → A['+(j+1)+']',j,n,'搬移 '+j,n));a[j+1]=a[j]}a[p]=v;f.push(frame(a,[],[p],[],'写入新元素',p,n+1,'新元素',n+1));return f}if(o==='delete'){if(i<0||i>=n)return[frame(a,[],[],[],'下标越界',i,n,'越界',n)];f.push(frame(a,[],[i],[i],'i 指向删除位置',i,n,'删除 '+i,n));for(let j=i;j<n-1;j++){let next=[...a];next[j]=next[j+1];f.push(frame(next,[j+1],[j],[],'A['+(j+1)+'] → A['+j+']',j+1,n,'搬移 '+(j+1),n));a[j]=a[j+1]}a.pop();f.push(frame(a,[],[],[],'n - 1',null,n-1,'',n-1));return f}return[frame(a)]}
